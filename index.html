<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NETORA</title>
<link rel="stylesheet" href="https://unpkg.com/lenis@1.3.26/dist/lenis.css">
<style>
  :root {
    --navy: #0C1B33;
    --gold: #C9A24B;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: auto; }
  html, body { background: var(--navy); overscroll-behavior-y: none; }
  /* The stage spans whatever is visible; the canvas inside it is a fixed box
     sized in svh, so the address bar sliding in and out never resizes it. It is
     centred, so when the bar hides, the extra room becomes navy on both sides
     rather than shunting the picture upward. */
  #stage { position: fixed; inset: 0; z-index: 0; display: grid; place-items: center; }
  #stage canvas {
    display: block; width: 100%;
    height: 100vh;   /* fallback where svh is unsupported */
    height: 100svh;  /* small viewport: measured with the chrome shown, so stable */
  }
  #scroll {
    position: relative; z-index: 1; pointer-events: none;
    height: 500vh;
    height: 500svh;  /* a scroll length the chrome cannot change mid-gesture */
  }
  /* Dev-only build marker — hidden unless served from a local network. */
  #build {
    position: fixed; left: 8px; bottom: 8px; z-index: 2; pointer-events: none;
    font: 500 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .06em; color: var(--gold); line-height: 1.5;
    white-space: pre;   /* two deliberate lines, never a wrap across the screen */
    background: rgba(12, 27, 51, .72); padding: 5px 7px; border-radius: 3px;
  }
  #build[hidden] { display: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="scroll"></div>
<div id="build" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.3.26/dist/lenis.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
// Belt and braces with the resize guard below: this stops ScrollTrigger itself
// from treating a mobile toolbar sliding in and out as a layout change. Deliberately
// no normalizeScroll() — it takes over scrolling and fights Lenis for it.
ScrollTrigger.config({ ignoreMobileResize: true });

const LETTERBOX = '#0C1B33';
// Portrait sets a 16:9 plate on a 9:16 screen, so about two thirds of the height
// is field whatever we do — the picture cannot grow without cropping the room
// back out of shot. So the field is composed instead of left empty: navy that
// deepens away from the plate, closed top and bottom by a gold hairline, and the
// whole plate lifted a little off dead centre, which reads as centred and leaves
// the lower field for the hero copy that lands here next.
const FIELD_DEEP = '#06101E';
const PLATE_RULE = 'rgba(201, 162, 75, 0.34)';
const OPTICAL_RISE = 0.04;
const MAX_DPR = 2;
const CONCURRENCY = 6;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

// The frames are 16:9. Covering a 9:16 phone with them would crop everything but
// the middle of the vault door, so a portrait viewport contains the frame to its
// own width instead and letterboxes above and below. Landscape and desktop cover.
const isPortrait = () => innerHeight > innerWidth;

// iOS fires resize continuously while the address bar slides. Reallocating the
// backing store there clears the canvas, and refreshing ScrollTrigger recomputes
// start/end and snaps the scroll under the reader's finger — which is what made
// the page feel unstable. The canvas box is measured from CSS (svh), so chrome
// moving leaves it identical and this reports no change.
let boxW = 0, boxH = 0, realResizes = 0;

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (w === boxW && h === boxH) return false;
  boxW = w; boxH = h;
  realResizes++;
  const dpr = Math.min(devicePixelRatio || 1, MAX_DPR);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  return true;
}

function paintBackdrop() {
  ctx.fillStyle = LETTERBOX;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// Navy at the plate's edge, deepening toward the screen edges, so the field reads
// as darkness around a lit aperture rather than as space left over.
function paintField(top, bottom) {
  const ch = canvas.height;
  const g = ctx.createLinearGradient(0, 0, 0, ch);
  g.addColorStop(0, FIELD_DEEP);
  g.addColorStop(Math.min(Math.max(top / ch, 0), 1), LETTERBOX);
  g.addColorStop(Math.min(Math.max(bottom / ch, 0), 1), LETTERBOX);
  g.addColorStop(1, FIELD_DEEP);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, canvas.width, ch);
}

// A hairline closing each long edge of the plate — one CSS pixel, so it stays a
// line and not a band on a 3x screen.
function paintRules(dx, dy, dw, dh) {
  const lw = Math.max(1, Math.round(canvas.width / Math.max(innerWidth, 1)));
  ctx.fillStyle = PLATE_RULE;
  ctx.fillRect(dx, Math.round(dy) - lw, dw, lw);
  ctx.fillRect(dx, Math.round(dy + dh), dw, lw);
}

function draw(img) {
  if (!img) { paintBackdrop(); return; }
  const cw = canvas.width, ch = canvas.height;
  const portrait = isPortrait();
  const fit = portrait
    ? Math.min(cw / img.width, ch / img.height)
    : Math.max(cw / img.width, ch / img.height);
  // Rounded to whole device pixels: a plate on a fractional offset is resampled
  // on every frame, which softens the image and costs work for nothing.
  const dw = Math.round(img.width * fit), dh = Math.round(img.height * fit);
  const dx = Math.round((cw - dw) / 2);
  const dy = Math.round((ch - dh) / 2 - (portrait ? ch * OPTICAL_RISE : 0));

  if (portrait) paintField(dy, dy + dh); else paintBackdrop();
  ctx.drawImage(img, dx, dy, dw, dh);
  if (portrait) paintRules(dx, dy, dw, dh);
}

// Device pixels the frame will actually occupy. Choosing the set from this is
// what keeps frames off an upscale: contained portrait needs only the viewport
// width, cover needs whatever spans the longer axis.
function drawnWidth(ratio) {
  const cw = canvas.width, ch = canvas.height;
  return isPortrait() ? Math.min(cw, ch * ratio) : Math.max(cw, ch * ratio);
}

// Sets are ascending by width; take the first that does not have to stretch.
// Chosen once, at load: swapping sets on rotate would mean re-downloading all
// 48 frames and holding two decoded sets at once, which is M4's call to make.
function pickSet(sets) {
  const need = drawnWidth(sets[0].width / sets[0].height);
  return sets.find((s) => s.width >= need) || sets[sets.length - 1];
}

// Which index.html and which frame build is actually on screen, and which fit
// branch it took. Only ever shown on a local network, so it never reaches the
// live site: on the old build the badge is absent entirely.
const IS_LOCAL = /^(localhost|127\.0\.0\.1|::1|\[::1\]|.*\.local)$/i.test(location.hostname)
  || /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname);

let buildNote = 'frames loading';
function showBuild(note) {
  if (note) buildNote = note;
  if (!IS_LOCAL) return;
  const el = document.getElementById('build');
  el.hidden = false;
  el.textContent = `${isPortrait() ? 'contain' : 'cover'} ${boxW}\u00d7${boxH}`
    + ` · ${realResizes} resize${realResizes === 1 ? '' : 's'}\n${buildNote}`;
}

function frameSrc(set, n) {
  return set.src.replace('%04d', String(n).padStart(4, '0'));
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error(src));
    img.src = src;
  });
}

(async function () {
  resize();
  paintBackdrop();
  showBuild();

  // Scrolling is live before a single frame has arrived, so the page is usable
  // the moment it opens and the frames fill in underneath it.
  const lenis = new Lenis();
  lenis.on('scroll', ScrollTrigger.update);
  gsap.ticker.add((time) => { lenis.raf(time * 1000); });
  gsap.ticker.lagSmoothing(0);

  let manifest;
  try {
    manifest = await fetch('public/frames/manifest.json').then((r) => r.json());
  } catch (err) {
    showBuild('NO FRAMES — run scripts/build-frames.sh');
    throw err;
  }
  const seq = manifest.sequence;
  const set = pickSet(seq.sets);
  const built = (manifest.builtAt || 'unstamped').slice(5).replace('T', ' ').replace('Z', '');
  showBuild(`${set.name} ${set.width}w · ${seq.frames}f/${seq.count}p · ${built}`);

  // The three clips are one timeline. `map` turns a scroll position into an
  // image index, so the hold at the open door costs repeated positions rather
  // than repeated files — the held frame is fetched once.
  const map = seq.map;
  const images = new Array(seq.frames);
  const state = { pos: 0 };
  let shown = -1;

  const wanted = () =>
    map[Math.min(Math.max(Math.round(state.pos), 0), map.length - 1)];

  // Scrolling ahead of the loader holds on the nearest image that has arrived
  // rather than blanking the canvas.
  function nearest(i) {
    if (images[i]) return i;
    for (let d = 1; d < images.length; d++) {
      if (images[i - d]) return i - d;
      if (images[i + d]) return i + d;
    }
    return -1;
  }

  function render() {
    const i = nearest(wanted());
    if (i < 0) return;
    draw(images[i]);
    shown = i;
  }

  gsap.to(state, {
    pos: seq.count - 1,
    ease: 'none',
    snap: 'pos',
    scrollTrigger: {
      trigger: '#scroll',
      start: 'top top',
      end: 'bottom bottom',
      scrub: true,
    },
    onUpdate: render,
  });

  addEventListener('resize', () => {
    // A rotation changes the box and must be honoured; the address bar does not
    // and must be ignored, or the scrub jumps every time the chrome moves.
    if (!resize()) return;
    render();
    showBuild();
    ScrollTrigger.refresh();
  });

  // First image on its own, so something is on screen as early as possible.
  try {
    images[0] = await loadImage(frameSrc(set, 1));
    render();
  } catch (err) {
    console.warn('first frame failed:', err.message);
  }

  // The rest stream in behind it. An arrival only repaints if it is a closer
  // match for wherever the scroll has already got to.
  let cursor = 1;
  await Promise.all(Array.from({ length: CONCURRENCY }, async () => {
    while (cursor < seq.frames) {
      const i = cursor++;
      try {
        images[i] = await loadImage(frameSrc(set, i + 1));
        const want = wanted();
        if (Math.abs(i - want) < Math.abs(shown - want)) render();
      } catch (err) {
        console.warn('frame failed:', err.message);
      }
    }
  }));
})();
</script>
</body>
</html>
