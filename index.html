<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Netora</title>
<link rel="preload" as="image" href="frames/frame-001.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Heebo:wght@500&display=swap">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }

  html{ background:#000; }

  body{
    /* The scroll track, in viewport heights:
         100  the viewport itself (never scrolls past)
         750  scrub travel — drives all 119 frames at the vault's original
              rate of ~6.36vh per frame, so the two shots read as one move
         100  hero hold — the last entrance frame sits still down here
       ------
         950                                                              */
    background:#000;
    height:950vh;
    overscroll-behavior-y:none;
  }

  #stage{
    position:fixed;
    inset:0;
    background:#000;
    overflow:hidden;
  }

  #frame{
    display:block;
    width:100%;
    height:100%;
  }

  /* hairline preload indicator — no text, fades out once every frame is in */
  #load{
    position:fixed;
    top:0; left:0;
    height:2px;
    width:0;
    background:#c8a04a;
    pointer-events:none;
    transition:width .18s linear, opacity .5s ease .2s;
    will-change:width;
  }
  #load.done{ opacity:0; }

  /* ---------- hero overlay ---------- */

  /* Rides on top of the rotunda while it holds still at the bottom of the
     track. Anchored to the viewport rather than to the picture: blit()
     covers, so on a wide screen only the middle band of the 9:16 frame is
     ever on show and "upper-left of the image" would sit off-screen. */
  #hero{
    position:fixed;
    top:0; left:0;
    z-index:2;
    /* Desktop keeps the whole block off the centre line; phones take more
       width below. Everything is in vw so the proportions hold at any size. */
    max-width:49vw;
    padding:
      calc(30vh + env(safe-area-inset-top))
      0 0
      max(6vw, calc(env(safe-area-inset-left) + 1rem));
    opacity:0;
    pointer-events:none;
    text-shadow:0 2px 40px rgba(0,0,0,.8), 0 1px 4px rgba(0,0,0,.6);
    -webkit-font-smoothing:antialiased;
    /* A guard, never a visible animation: on the way out it holds at full
       opacity until the words have finished leaving, then switches. Fading
       the container instead would hide the very motion it is covering. */
    transition:opacity 0s linear .42s;
  }
  #hero.on{ opacity:1; transition:opacity 0s; }

  /* Every word is a span, and every character inside it is a span too. All
     of them are always in the document, always occupying their space; the
     variants only ever touch opacity, transform, filter and a caret drawn as
     a pseudo-element. None of those affect layout, so the three animations
     are guaranteed to lay out identically and nothing reflows mid-reveal.

     Each variant is two CSS states and a per-item delay, which is what makes
     the reverse free and identical in all three: leaving the hold runs the
     same two states backwards, and because nothing is latched, arriving
     again replays from the top however many times you like. --i numbers the
     words, --n numbers the characters (spaces included, so the rhythm keeps
     them). */
  .w{ display:inline-block; }

  /* ---- variant 1: typewriter, one character at a time ---- */
  #hero[data-anim="1"] .c{
    opacity:0;
    transition:opacity .12s ease;               /* leaving: all at once */
  }
  #hero[data-anim="1"].on .c{
    opacity:1;
    transition:opacity 0s;                      /* arriving: it snaps on... */
    transition-delay:calc(var(--n) * 34ms);     /* ...at its turn in the queue */
  }
  /* The caret is one bar per character, each alive for exactly its own tick,
     so it marches along the line as the letters land. */
  #hero[data-anim="1"] .c{ position:relative; }
  #hero[data-anim="1"].on .c::after{
    content:"";
    position:absolute;
    left:100%; top:.1em;
    width:.055em; height:.78em;
    background:currentColor;
    opacity:0;
    animation:caret-step 34ms step-end calc(var(--n) * 34ms) 1 forwards;
  }
  #hero[data-anim="1"] [dir="rtl"] .c::after{ left:auto; right:100%; }
  #hero[data-anim="1"].on .c.last::after{
    animation:caret-blink .9s step-end calc(var(--n) * 34ms) infinite;
  }
  @keyframes caret-step { from{ opacity:.75 } to{ opacity:0 } }
  @keyframes caret-blink{ 0%,50%{ opacity:.75 } 50.01%,100%{ opacity:0 } }

  /* ---- variant 2: each word rises into place as it fades up ---- */
  #hero[data-anim="2"] .w{
    opacity:0;
    transform:translateY(.42em);
    filter:blur(9px);
    transition:opacity .26s ease, transform .26s ease, filter .26s ease;
  }
  #hero[data-anim="2"].on .w{
    opacity:1;
    transform:none;
    filter:blur(0);
    transition:opacity .52s ease-out,
               transform .52s cubic-bezier(.22,.68,.24,1),
               filter .52s ease-out;
    transition-delay:calc(var(--i) * 62ms);
  }

  /* ---- variant 3: each word fades up, nothing moves ---- */
  #hero[data-anim="3"] .w{
    opacity:0;
    transition:opacity .2s ease;
  }
  #hero[data-anim="3"].on .w{
    opacity:1;
    transition:opacity .34s ease;
    transition-delay:calc(var(--i) * 46ms);
  }

  .hero-l1{
    /* The padding above puts the line BOX at 30vh; this lifts it by the
       leading and the gap above the capitals, so the glyph tops land there
       instead. In em, so it re-solves itself for each size regime. */
    margin-top:-.33em;
    font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-weight:500;
    font-size:4.6vw;
    line-height:1.1;
    letter-spacing:.006em;
    color:#d9b877;                                  /* warm gold */
  }
  /* Plain solid colour, no halo, glow or edge of any kind. text-shadow is
     set to none rather than left to inherit, so the word carries nothing but
     its own colour. */
  .hero-l1 .accent{
    color:#071426;
    text-shadow:none;
  }

  /* The largest of the three — line 1 introduces it, this is the statement.
     Margins are in em so the gaps grow with the type they separate. */
  .hero-l2{
    margin-top:.7em;
    font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-weight:600;
    font-size:4.9vw;
    line-height:1.15;
    letter-spacing:.004em;
    color:#dde1e6;
  }

  /* fit-content so the RTL line still starts flush with the English ones:
     a full-width rtl block would push its text to the far right. */
  .hero-arrow{
    width:fit-content;
    max-width:100%;
    margin-top:2.6em;
    font-family:'Heebo', 'Arial Hebrew', Arial, sans-serif;
    font-weight:500;
    font-size:2.2vw;
    line-height:1.4;
    letter-spacing:.01em;
    color:rgba(200,160,74,.72);                     /* muted #c8a04a */
  }

  /* Phones run the reference scale itself: 8.8vw gives line 1 the 5.5vw
     cap-height, line 2 is 9vw and breaks of its own accord after "dreams",
     and the block is allowed 88vw. The two regimes cannot meet — a 5.5vw
     capital and a block inside 50vw are not simultaneously satisfiable at
     any width — so the step at 768px is the one the brief asks for, not an
     oversight. */
  @media (max-width:767.98px){
    #hero{ max-width:88vw; }
    .hero-l1{ font-size:8.8vw; }
    .hero-l2{ font-size:9vw; }
    .hero-arrow{ font-size:4vw; }
  }

  /* The real text, for assistive tech and for anything reading the page
     without running the reveal. The animated copy above is aria-hidden. */
  /* Tiny variant switcher. Its own layer, above the text, and the only thing
     on the page that takes a pointer. */
  #anim{
    position:fixed;
    z-index:4;
    right:calc(.75rem + env(safe-area-inset-right));
    bottom:calc(.75rem + env(safe-area-inset-bottom));
    display:flex;
    gap:.25rem;
    padding:.25rem;
    border-radius:999px;
    background:rgba(8,14,26,.55);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border:1px solid rgba(200,160,74,.28);
  }
  #anim button{
    width:1.85rem; height:1.85rem;
    border:0;
    border-radius:999px;
    background:transparent;
    color:rgba(226,214,190,.72);
    font:600 .8rem/1 system-ui, -apple-system, sans-serif;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  #anim button[aria-pressed="true"]{
    background:rgba(200,160,74,.9);
    color:#0b1220;
  }

  .hero-sr{
    position:absolute;
    width:1px; height:1px;
    margin:-1px; padding:0;
    overflow:hidden;
    clip:rect(0 0 0 0);
    clip-path:inset(50%);
    white-space:nowrap;
    border:0;
  }

  @media (prefers-reduced-motion:reduce){
    #load{ transition:none; }
    #hero, #hero.on{ transition:none; }
    /* Keep every variant's sequence and both of its directions — take away
       only the parts that are actually motion. Variant 1 stops flickering
       character by character and reveals whole words instead. */
    #hero[data-anim="2"] .w, #hero[data-anim="2"].on .w{ transform:none; filter:none; }
    #hero[data-anim="1"] .c{ opacity:1; transition:none; }
    #hero[data-anim="1"].on .c::after,
    #hero[data-anim="1"].on .c.last::after{ animation:none; opacity:0; }
    #hero[data-anim="1"] .w{ opacity:0; transition:opacity .28s ease; }
    #hero[data-anim="1"].on .w{
      opacity:1;
      transition:opacity .4s ease;
      transition-delay:calc(var(--i) * 50ms);
    }
  }
</style>
</head>
<body>

<div id="stage"><canvas id="frame"></canvas></div>
<div id="load"></div>

<div id="hero" data-anim="2">
  <h1 class="hero-sr">Welcome to Netora</h1>
  <p class="hero-sr">Here we turn dreams into reality</p>
  <p class="hero-sr" lang="he" dir="rtl">↓ לצפייה בעבודות שלנו</p>

  <!-- One span per word, one per character inside it. --i is the word's
       place in the queue, --n the character's; both count spaces, so the
       three variants share one rhythm. -->
  <div aria-hidden="true">
    <div class="hero-l1">
      <span class="w" style="--i:0"><span class="c" style="--n:0">W</span><span class="c" style="--n:1">e</span><span class="c" style="--n:2">l</span><span class="c" style="--n:3">c</span><span class="c" style="--n:4">o</span><span class="c" style="--n:5">m</span><span class="c" style="--n:6">e</span></span>
      <span class="w" style="--i:1"><span class="c" style="--n:8">t</span><span class="c" style="--n:9">o</span></span>
      <span class="w accent" style="--i:2"><span class="c" style="--n:11">N</span><span class="c" style="--n:12">e</span><span class="c" style="--n:13">t</span><span class="c" style="--n:14">o</span><span class="c" style="--n:15">r</span><span class="c" style="--n:16">a</span></span>
    </div>
    <div class="hero-l2">
      <span class="w" style="--i:3"><span class="c" style="--n:18">H</span><span class="c" style="--n:19">e</span><span class="c" style="--n:20">r</span><span class="c" style="--n:21">e</span></span>
      <span class="w" style="--i:4"><span class="c" style="--n:23">w</span><span class="c" style="--n:24">e</span></span>
      <span class="w" style="--i:5"><span class="c" style="--n:26">t</span><span class="c" style="--n:27">u</span><span class="c" style="--n:28">r</span><span class="c" style="--n:29">n</span></span>
      <span class="w" style="--i:6"><span class="c" style="--n:31">d</span><span class="c" style="--n:32">r</span><span class="c" style="--n:33">e</span><span class="c" style="--n:34">a</span><span class="c" style="--n:35">m</span><span class="c" style="--n:36">s</span></span>
      <span class="w" style="--i:7"><span class="c" style="--n:38">i</span><span class="c" style="--n:39">n</span><span class="c" style="--n:40">t</span><span class="c" style="--n:41">o</span></span>
      <span class="w" style="--i:8"><span class="c" style="--n:43">r</span><span class="c" style="--n:44">e</span><span class="c" style="--n:45">a</span><span class="c" style="--n:46">l</span><span class="c" style="--n:47">i</span><span class="c" style="--n:48">t</span><span class="c" style="--n:49">y</span></span>
    </div>
    <div class="hero-arrow" lang="he" dir="rtl"><span class="w" style="--i:9"><span class="c" style="--n:51">↓</span><span class="c" style="--n:52">&#160;</span><span class="c" style="--n:53">ל</span><span class="c" style="--n:54">צ</span><span class="c" style="--n:55">פ</span><span class="c" style="--n:56">י</span><span class="c" style="--n:57">י</span><span class="c" style="--n:58">ה</span><span class="c" style="--n:59">&#160;</span><span class="c" style="--n:60">ב</span><span class="c" style="--n:61">ע</span><span class="c" style="--n:62">ב</span><span class="c" style="--n:63">ו</span><span class="c" style="--n:64">ד</span><span class="c" style="--n:65">ו</span><span class="c" style="--n:66">ת</span><span class="c" style="--n:67">&#160;</span><span class="c" style="--n:68">ש</span><span class="c" style="--n:69">ל</span><span class="c" style="--n:70">נ</span><span class="c last" style="--n:71">ו</span></span></div>
  </div>
</div>

<div id="anim" role="group" aria-label="Text reveal style">
  <button type="button" data-anim="1" aria-pressed="false">1</button>
  <button type="button" data-anim="2" aria-pressed="true">2</button>
  <button type="button" data-anim="3" aria-pressed="false">3</button>
</div>

<script>
/* The hero overlay reveals itself once the rotunda has settled. It owns no
   scroll handling — the scrubber calls enter()/exit() off the very same
   clamped progress value it uses to choose a frame, so the reveal cannot
   drift out of step with the picture underneath it.

   The animation itself is entirely CSS, and all three variants are built the
   same way: two states and a per-item delay. Both directions therefore come
   from one mechanism, which is why the reverse behaves identically in each —
   leaving the hold runs the states backwards, and since nothing is latched,
   returning replays from the top every time. */
(function () {
  'use strict';

  var root = document.getElementById('hero');
  var bar  = document.getElementById('anim');
  if (!root) return;

  var VARIANTS = ['1', '2', '3'];
  var DEFAULT  = '2';
  var KEY      = 'netora-anim';

  var want  = false;   // the scroll is settled on the final frame
  var shown = false;   // the reveal class is applied
  var fonts = false;   // webfonts settled; a swap mid-flight would re-measure
  var swap  = 0;

  function sync() {
    if (want && fonts) {
      if (!shown) { shown = true; root.classList.add('on'); }
    } else if (shown) {
      shown = false; root.classList.remove('on');
    }
  }

  /* ---------- which reveal ---------- */

  function saved() {
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  }

  function requested() {
    var m = /[?&]anim=([^&]*)/.exec(location.search);
    return m ? decodeURIComponent(m[1]) : null;
  }

  function commit(v) {
    root.setAttribute('data-anim', v);
    try { localStorage.setItem(KEY, v); } catch (e) {}
    if (bar) {
      var bs = bar.getElementsByTagName('button');
      for (var i = 0; i < bs.length; i++) {
        bs[i].setAttribute('aria-pressed',
          bs[i].getAttribute('data-anim') === v ? 'true' : 'false');
      }
    }
    // Keep the address bar in step, so a chosen variant is a shareable link.
    try {
      var u = new URL(location.href);
      u.searchParams.set('anim', v);
      history.replaceState(null, '', u.pathname + u.search + u.hash);
    } catch (e) {}
  }

  // Switching (or re-picking the current one) plays the reveal again, out and
  // then back in — the same round trip scrolling away and back would give.
  function choose(v) {
    if (VARIANTS.indexOf(v) < 0) return;
    if (!shown) { commit(v); return; }
    shown = false;
    root.classList.remove('on');
    clearTimeout(swap);
    swap = setTimeout(function () { commit(v); void root.offsetWidth; sync(); }, 330);
  }

  var start = requested() || saved() || DEFAULT;
  commit(VARIANTS.indexOf(start) < 0 ? DEFAULT : start);

  if (bar) {
    bar.addEventListener('click', function (e) {
      var el = e.target;
      while (el && el !== bar && !el.getAttribute('data-anim')) el = el.parentNode;
      if (el && el !== bar) choose(el.getAttribute('data-anim'));
    });
  }

  /* ---------- fonts ---------- */

  function ready() {
    if (fonts) return;
    fonts = true;
    sync();
  }

  if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
    var bail = setTimeout(ready, 1500);
    document.fonts.ready.then(function () { clearTimeout(bail); ready(); }, ready);
  } else {
    fonts = true;
  }

  /* The scrubber drives these, on every painted scroll event, so both are
     guarded down to a no-op once they have had their effect. */
  window.NetoraHero = {
    enter: function () { want = true;  sync(); },
    exit:  function () { want = false; sync(); }
  };
})();
</script>

<script>
(function () {
  'use strict';

  // One timeline across two clips: the vault door opens, then the camera
  // carries through the doorway into the rotunda.
  //
  //   timeline 0..47    vault-open    frames/frame-001..048
  //   timeline 48..118  entrance      frames-entrance/frame-002..072
  //
  // The entrance clip's own frame-001 is the same picture as vault
  // frame-048 — it is the seam the two shots were cut on. It stays in the
  // folder so that sequence stands alone, but it is skipped here: spending
  // a scroll step repainting an identical frame would read as a stall at
  // the exact moment the camera should start moving.
  var VAULT = 48;
  var COUNT = 119;

  // Fraction of the scroll track that drives frames. Past it the last
  // frame simply holds, giving the hero rotunda a full viewport of stillness
  // at the bottom. 750 of the 850vh of travel scrubs; the rest holds.
  var SCRUB = 750 / 850;

  var stage  = document.getElementById('stage');
  var canvas = document.getElementById('frame');
  var bar    = document.getElementById('load');
  var ctx    = canvas.getContext('2d', { alpha: false });

  var hero    = window.NetoraHero;

  var images  = new Array(COUNT);
  var loaded  = 0;
  var ready   = false;
  var drawn   = -1;   // frame index currently painted
  var queued  = false;

  function pad(n) {
    return String(n).padStart(3, '0');
  }

  function srcFor(i) {
    return i < VAULT
      ? 'frames/frame-' + pad(i + 1) + '.jpg'
      : 'frames-entrance/frame-' + pad(i - VAULT + 2) + '.jpg';
  }

  /* ---------- painting ---------- */

  // Size the backing store to the viewport, but never ask for more pixels
  // than the source frames actually contain — both clips are 720x1280, so
  // going beyond that just burns memory for no visible detail.
  function resize() {
    var cssW = stage.clientWidth;
    var cssH = stage.clientHeight;
    if (!cssW || !cssH) return;

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.round(cssW * dpr);
    var h = Math.round(cssH * dpr);

    var cap = 1280 * 1280;                       // pixel budget
    var area = w * h;
    if (area > cap) {
      var k = Math.sqrt(cap / area);
      w = Math.round(w * k);
      h = Math.round(h * k);
    }

    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      drawn = -1;                                // force a repaint
    }
    paint();
  }

  // cover: fill the canvas, preserve aspect, centre the overflow
  function blit(img) {
    var cw = canvas.width;
    var ch = canvas.height;
    var iw = img.naturalWidth;
    var ih = img.naturalHeight;
    if (!iw || !ih) return;

    var s = Math.max(cw / iw, ch / ih);
    var w = iw * s;
    var h = ih * s;
    ctx.drawImage(img, (cw - w) / 2, (ch - h) / 2, w, h);
  }

  function progress() {
    var max = document.documentElement.scrollHeight - window.innerHeight;
    if (max <= 0) return 0;
    var p = window.scrollY / max;
    // iOS rubber-banding can overshoot in both directions
    return p < 0 ? 0 : p > 1 ? 1 : p;
  }

  function paint() {
    // Until every frame is decoded, hold on the closed door rather than
    // showing gaps — this is what keeps scrubbing flicker-free later.
    var idx = 0;
    if (ready) {
      var p = progress() / SCRUB;
      if (p > 1) p = 1;                          // the hold at the bottom
      idx = Math.round(p * (COUNT - 1));
    }

    // The hero overlay rides the same clamp: p === 1 is the scrub finished
    // and the rotunda holding still. Above the early-out, which returns on
    // every scroll event once the held frame is already painted.
    if (hero) hero[ready && p >= 1 ? 'enter' : 'exit']();

    if (idx === drawn) return;

    var img = images[idx];
    if (!img || !img.complete || !img.naturalWidth) return;

    drawn = idx;
    blit(img);
  }

  function schedule() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(function () {
      queued = false;
      paint();
    });
  }

  /* ---------- preload ---------- */

  function load(i) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.decoding = 'async';

      function settle() {
        loaded++;
        bar.style.width = (loaded / COUNT * 100) + '%';
        resolve();
      }

      img.onload = function () {
        // Decode up front so the first paint of each frame is instant.
        // Keep plain <img> rather than ImageBitmap: the browser may evict
        // a decoded frame under memory pressure and silently re-decode
        // from cache, instead of the tab being killed outright.
        if (img.decode) {
          img.decode().then(function () {
            images[i] = img;
            settle();
          }, function () {
            images[i] = img;
            settle();
          });
        } else {
          images[i] = img;
          settle();
        }
      };

      img.onerror = function () {
        images[i] = null;
        settle();
      };

      img.src = srcFor(i);
    });
  }

  function start() {
    resize();

    // Frame 1 first, so the closed door is on screen almost immediately
    // instead of a black hold while the rest streams in.
    load(0).then(function () {
      paint();

      // Requested in timeline order, so the frames the viewer reaches
      // first are also the ones the browser fetches first.
      var rest = [];
      for (var i = 1; i < COUNT; i++) rest.push(load(i));

      return Promise.all(rest);
    }).then(function () {
      ready = true;
      bar.classList.add('done');
      drawn = -1;
      paint();
    });
  }

  window.addEventListener('scroll', schedule, { passive: true });
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  // A bfcache restore can bring back a scroll position with a stale canvas.
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) { drawn = -1; paint(); }
  });

  start();
})();
</script>

</body>
</html>
