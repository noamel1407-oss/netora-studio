<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Netora</title>
<link rel="preload" as="image" href="frames/frame-001.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Frank+Ruhl+Libre:wght@500&family=Heebo:wght@500&display=swap">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }

  html{ background:#000; }

  body{
    /* The scroll track, in viewport heights:
         100  the viewport itself (never scrolls past)
         750  scrub travel — drives all 119 frames at the vault's original
              rate of ~6.36vh per frame, so the two shots read as one move
         200  hero dwell — the light sweep plays itself whenever the scroll
              arrives down here, on GSAP's clock rather than the scroll's,
              and again on every later arrival from either end. On the
              first of them the page is pinned for ~2.2s so the reveal
              cannot be scrolled past; after that it re-plays without
              taking the scroll. The rest of the band is simply room to
              rest on while the words read
          80  end hold — the finished hero rests here
          80  treasure cross-fade — the treasure room is dissolved in over
              this, taking the rotunda and the words down with it
          20  landing — the room, fully opaque, simply held. Deliberately
              left empty: the portfolio picks up from it
       ------
        1230

       Everything above the cross-fade keeps the number it always had. The
       track grew underneath it, not around it: the frames still finish at
       750vh of travel and the treasure fade still starts at 1030vh. */
    background:#000;
    height:1230vh;
    overscroll-behavior-y:none;
  }

  #stage{
    position:fixed;
    inset:0;
    background:#000;
    overflow:hidden;
  }

  #frame{
    display:block;
    width:100%;
    height:100%;
  }

  /* hairline preload indicator — no text, fades out once every frame is in */
  #load{
    position:fixed;
    top:0; left:0;
    height:2px;
    width:0;
    background:#c8a04a;
    pointer-events:none;
    transition:width .18s linear, opacity .5s ease .2s;
    will-change:width;
  }
  #load.done{ opacity:0; }

  /* ---------- hero overlay ---------- */

  /* Rides on top of the rotunda while it holds still at the bottom of the
     track. Anchored to the viewport rather than to the picture: blit()
     covers, so on a wide screen only the middle band of the 9:16 frame is
     ever on show and "upper-left of the image" would sit off-screen. */
  #hero{
    position:fixed;
    top:0; left:0;
    z-index:2;
    /* Desktop keeps the whole block off the centre line; phones take more
       width below. Everything is in vw so the proportions hold at any size. */
    max-width:49vw;
    /* Vertical position is a readability decision, measured rather than
       chosen by eye — see the aspect-ratio rules below. This is the
       portrait value. */
    padding:
      calc(40vh + env(safe-area-inset-top))
      0 0
      max(6vw, calc(env(safe-area-inset-left) + 1rem));
    pointer-events:none;
    -webkit-font-smoothing:antialiased;
  }

  /* The animated copy, as one block. Everything the reveal writes lands
     either on this element or on a plain custom property declared on it —
     so taking the block off screen is one opacity + visibility write here,
     whatever the sweep left behind it. Hiding at the common ancestor is
     what makes "gone" atomic: nothing half-applied further down can reach
     the screen through an invisible parent. These two declarations are also
     the at-rest state, which is what shows (i.e. nothing) if the script
     never runs; visibility rather than display so the text still lays out
     and the webfonts are still fetched for it. */
  #hero-type{
    visibility:hidden;
    opacity:0;
  }

  /* ---------- the reveal ---------- */

  /* Warm gold for the headline, off-white for the statement, and the one
     dark muted gold both of them start in — engraved, but not yet lit. The
     colours live here, on the wrapper, so the sweep below can be one
     gradient declared twice rather than two unrelated animations. */
  #hero-type{
    --unlit:#5c4626;                                /* engraved, unlit */
    --hot:#fffbf1;                                  /* the light band itself */
    /* Where the band is, as a background-position percentage. It counts
       DOWN as the sweep runs: a high number is the band still off the left
       of the block with nothing lit, a low one is the band gone off the
       right with everything lit. The script sweeps it 84 -> 12; see the
       gradient below for where those two come from.

       It rests at 0 — past the lit end, and so the finished state — so that
       any path which gets the block on screen without the script driving it
       shows lit, readable text rather than dark text. The script writes the
       dark end into it before the block can ever be seen, and owns it from
       then on: the sweep is re-run on every arrival at the rotunda, so this
       value is rewound and played forward again rather than being handed
       back to the stylesheet at the end. */
    --sweep:0;
  }
  .hero-l1{ --lit:#ecc47a; }                        /* warm gold, every word */
  .hero-l2{ --lit:#dfe4ea; }                        /* off-white */

  .hero-line{ position:relative; }

  /* Readability halo. The rotunda behind the type is not a flat backdrop —
     the light shaft off the oculus crosses right through the headline — so
     each glyph carries its own pool of darkness to sit in. Three stacked
     shadows at zero offset: a tight one that does the separating, a mid one
     that softens its edge, and a wide one that just lowers the whole area.
     No offset, so it reads as a halo rather than a drop shadow, and no
     single layer is opaque enough to look like an outline.

     Radii are in em and the rule is on the line elements rather than on
     #hero, because em on the container would resolve against the
     container's font-size and the halo would come out the same absolute
     size on 66px type and 32px type. Tune the alphas to change strength.

     On the two English lines the halo is a layer of its own, carrying
     nothing but the shadows — its own fill is transparent, so the shadows
     are all that reaches the screen. That separation is forced rather than
     stylistic: the ink layer clips a gradient to its glyphs, and an
     element's background is painted UNDER its own text and text-shadow, so
     a shadow on the ink would land on top of the gold instead of behind it.

     A pseudo-element rather than a second span, because this copy is not
     text: it is a shadow in the shape of text, and putting it in the
     document would put the headline into find-in-page, selection and the
     clipboard three times over. Same box, so it wraps identically —
     absolutely placed against .hero-line, which the ink sizes.

     Being a separate layer is not by itself enough to get it behind,
     though, and order has nothing to do with it: this one is positioned and
     the ink is not, and a positioned descendant paints after the in-flow
     content of its stacking context whatever order they come in. So the ink
     claims a stacking level of its own below, and that is what puts the
     shadows behind the gold. */
  .hero-line::before,
  .hero-arrow{
    text-shadow:
      0 0 .10em rgba(2, 6, 16, .66),
      0 0 .28em rgba(2, 6, 16, .56),
      0 0 .80em rgba(2, 6, 16, .45);
  }
  .hero-line::before{
    content:attr(data-text);
    position:absolute;
    top:0; left:0; right:0;
    color:transparent;
    -webkit-text-fill-color:transparent;
  }

  /* The lit copy, and the element in flow — it is what gives .hero-line its
     height, and the absolutely-placed halo stretches to the same box, so
     the two copies wrap identically at every width by construction.
     position+z-index only to sit above the halo; no offsets, so it does not
     move. See the note above for why it has to say so out loud. */
  .hero-ink{
    display:block;
    position:relative;
    z-index:1;
    color:var(--lit);        /* if the clip below is unavailable: simply lit */
  }

  /* The sweep. Nothing moves: the only thing animating is where, along the
     x axis, the colour changes. No transform, no filter, no blur, and
     nothing reading the scroll — which is also why it is not tempered under
     prefers-reduced-motion further down.

     The gradient is three times the width of the line box and runs
     lit -> hot -> unlit. Sliding it across drags that boundary through the
     glyphs, so everything the band has passed is lit and stays lit. Being
     lit is not a state anything has to remember or re-assert; it is simply
     what the left of this gradient is.

     The 42/50/55 stops are measured against the 300% width, not chosen by
     eye. The box shows exactly a third of the image, so the visible third
     is entirely past 55% (all unlit) while --sweep is 84, and entirely
     before 42% (all lit) by the time it reaches 12 — and between those two
     the band crosses the box edge to edge with no dead time at either end.
     The two sides of the band are deliberately uneven: 5% of image ahead of
     the hot core against 8% behind it, so the light arrives a little harder
     than it leaves and the glyphs settle into being lit rather than
     switching.

     Both lines carry this declaration and both read --sweep off the shared
     wrapper, and both are full-width blocks, so their background boxes are
     the same width: the band is one straight edge crossing the whole block
     rather than two lines lighting at their own rates. */
  @supports ((-webkit-background-clip:text) or (background-clip:text)){
    .hero-ink{
      background-image:linear-gradient(90deg,
        var(--lit)     0%,
        var(--lit)    42%,
        var(--hot)    50%,
        var(--unlit)  55%,
        var(--unlit) 100%);
      background-size:300% 100%;
      background-repeat:no-repeat;
      background-position:calc(var(--sweep) * 1%) 0;
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      -webkit-text-fill-color:transparent;
    }
  }

  .hero-l1{
    /* The padding above puts the line BOX at 30vh; this lifts it by the
       leading and the gap above the capitals, so the glyph tops land there
       instead. In em, so it re-solves itself for each size regime. */
    margin-top:-.33em;
    font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-weight:500;
    font-size:4.6vw;
    line-height:1.1;
    letter-spacing:.006em;
  }
  /* The largest of the three — line 1 introduces it, this is the statement.
     Margins are in em so the gaps grow with the type they separate. */
  .hero-l2{
    margin-top:.7em;
    font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-weight:600;
    font-size:4.9vw;
    line-height:1.15;
    letter-spacing:.004em;
  }

  /* fit-content so the RTL line still starts flush with the English ones:
     a full-width rtl block would push its text to the far right. It is
     faded in by the script as the band leaves the English, and rests
     visible here so that — as with --sweep — the state the stylesheet
     declares is the finished one. */
  .hero-arrow{
    width:fit-content;
    max-width:100%;
    margin-top:2.6em;
    font-family:'Heebo', 'Arial Hebrew', Arial, sans-serif;
    font-weight:500;
    font-size:2.2vw;
    line-height:1.4;
    letter-spacing:.01em;
    color:rgba(200,160,74,.72);                     /* muted #c8a04a */
  }

  /* While the reveal plays, the page is pinned. This stops a new pan
     gesture from starting at all; the script's preventDefault handlers stop
     one already under way, and re-writing the scroll position stops the
     momentum that neither of those can reach. Two and a bit seconds, once
     per page load — the class is added and removed by the script, and has
     a fuse on it there.

     pinch-zoom rather than none: what is being held is the page's position
     in the track, and somebody enlarging the type is not moving it. The
     script's touchmove handler lets a second finger through for the same
     reason. */
  html.hero-locked,
  html.hero-locked *{ touch-action:pinch-zoom; }

  /* Phones run the reference scale itself: 8.8vw gives line 1 the 5.5vw
     cap-height, line 2 is 9vw and breaks of its own accord after "dreams",
     and the block is allowed 88vw. The two regimes cannot meet — a 5.5vw
     capital and a block inside 50vw are not simultaneously satisfiable at
     any width — so the step at 768px is the one the brief asks for, not an
     oversight. */
  @media (max-width:767.98px){
    #hero{ max-width:88vw; }
    .hero-l1{ font-size:8.8vw; }
    .hero-l2{ font-size:9vw; }
    .hero-arrow{ font-size:4vw; }
  }

  /* The real text, for assistive tech and for anything reading the page
     without running the reveal. The animated copy above is aria-hidden. */
  /* Where the block sits vertically is set by the picture, not by taste.
     blit() covers, so how much of the 9:16 still is on screen — and
     therefore where its band of lit arched windows lands — is a function of
     the viewport's aspect ratio, not its width. The windows occupy roughly
     22-36% of the frame's own height; the wider the viewport, the more of
     the top and bottom is cropped away and the higher that band rides.

     Measured on the rendered page at each of these ratios, these are the
     positions where no pixel behind any of the three lines is brighter than
     the text it carries:

       portrait      the windows sit mid-screen, and the dark dome above
                     them is too short for the block — lifting line 1 onto
                     it would drop line 2 straight onto the windows. The
                     block goes below them instead.
       1.0 - 1.45    the crop has pushed the windows up; 23vh clears them.
       wider         only a sliver of the window band survives at the very
                     top of the frame, so the block can ride high. */
  @media (min-aspect-ratio:1/1) and (max-aspect-ratio:29/20){
    #hero{ padding-top:calc(23vh + env(safe-area-inset-top)); }
  }
  @media (min-aspect-ratio:29/20){
    #hero{ padding-top:calc(15vh + env(safe-area-inset-top)); }
  }

  .hero-sr{
    position:absolute;
    width:1px; height:1px;
    margin:-1px; padding:0;
    overflow:hidden;
    clip:rect(0 0 0 0);
    clip-path:inset(50%);
    white-space:nowrap;
    border:0;
  }

  /* ---------- treasure room ---------- */

  /* The last picture, laid over everything: the rotunda, the hero words and
     the load hairline. Anchored to the viewport, like #stage below it, so
     the two pictures sit in register and the dissolve is a straight blend
     of one into the other rather than a slide.

     object-fit:cover is the same framing rule blit() applies to the frames:
     fill the viewport, keep the ratio, centre whatever overflows. So the
     9:16 still fills a wide screen without bars and without stretching.

     Opacity is written from the scroll position by script, on every paint.
     It starts at 0 here, which is also where it stays if the script never
     runs or the picture never arrives. No transition: the opacity is the
     scroll position, not a reaction to it.

     Deliberately no background colour. cover cannot leave a bar to fill, so
     one would only ever show while the picture is still on its way — and a
     black rectangle rising over the rotunda is a worse failure than the
     rotunda simply staying. */
  #treasure{
    position:fixed;
    /* One pixel of overshoot on every side, rather than inset:0. At inset:0
       the layer's own edge does not reliably reach the last device pixel
       column or row: measured across twelve viewport and pixel-ratio
       combinations, several leave a hairline of the rotunda showing down the
       edge of the screen once the room is fully up. Growing the box past the
       viewport puts that edge off-screen, and the crop below is then figured
       on a box two pixels larger — half a percent at phone size, which is
       nothing, and it holds at every ratio measured.
       The width and height have to grow with it: with them left at 100% the
       box would simply be shifted a pixel left and the seam would move to
       the other edge, which is worse. */
    inset:-1px;
    z-index:3;
    width:calc(100% + 2px);
    height:calc(100% + 2px);
    object-fit:cover;
    object-position:center;
    opacity:0;
    pointer-events:none;
    will-change:opacity;
  }

  /* ---------- the two doors out of the treasure room ---------- */

  /* ---- the nudge knobs ----

     Back on the panels, and back in the PICTURE's coordinates to stay
     there: 0% is the still's left/top edge and 100% its right/bottom,
     whatever the screen happens to be cropping. The centred row this
     replaces read cleanly at any ratio but landed the labels on the gold N
     cut into the floor, and gold on gold is not a label.

     Read off the still rather than chosen: the left panel's blank blue
     field runs 7-21.5% across, the right panel's 77.5-92%, and both run
     33-54% down. Each pair below is the middle of one panel.

     These four are the numbers to nudge. */
  :root{
    --room-cta-left-x:  14.2%;
    --room-cta-left-y:  44%;
    --room-cta-right-x: 84.7%;
    --room-cta-right-y: 44%;

    /* The plate, sized as one piece: everything below is in em of this, so
       changing this one length scales the whole plaque and leaves its
       proportions alone. It grows with the picture between a phone and a
       big desktop and then stops.

       The label is set on two lines — לצפייה over באתר — which is what
       makes the plate a plaque rather than a bar: the widest line is a bit
       over half the one-line label, so the plate is 64px across on a 1440
       screen where the panel is 209px, and the blue around it does the
       rest. Narrow matters on a phone as well as on the eye: cover crops
       the panels there, and a plate this size is nearly the width of what
       is left of one. */
    --room-cta-fs:   clamp(11px, .78vw, 15px);
    /* Both in em of the size above, and both chosen from the label rather
       than picked: the long line is 3.9em wide and the two lines together
       are 3em tall, so these leave a shade under .9em of air on all four
       sides. Even spacing is what makes it read as a plaque rather than a
       box with words jammed in it, and it is why the two are not equal —
       the plate is a little wider than it is tall because the text is. */
    --room-cta-w:    5.7em;
    --room-cta-h:    4.8em;
    --room-cta-edge: .5rem;    /* the closest it may come to the screen edge */

    --room-ar: 0.562799;       /* 941/1672 — the still's own aspect ratio */
  }

  /* The layer the plates live on: the same box as #treasure, laid over it.
     It holds no state of its own. The script under the cross-fade writes
     the room's opacity into --room-cta-fade and turns data-live on and off
     with it, so the buttons arrive with the room, leave with it, and are
     tappable for exactly as long as it is on screen — the whole of the
     dissolve included, where the picture is up but not yet opaque.

     The fade is carried on a custom property the buttons read rather than
     as opacity on this element, because an ancestor at less than full
     opacity is a backdrop root: it would cut a plate off from the room
     behind it, and anything sampling that backdrop would stop working
     until the dissolve had finished. */
  #room-cta{
    position:fixed;
    /* Including the one pixel of overshoot, so the cover crop worked out
       below is the crop the picture is actually showing. */
    inset:-1px;
    z-index:4;
    width:calc(100% + 2px);
    height:calc(100% + 2px);

    /* The layer itself never takes a tap — only the two buttons do, and
       only while they are live. The rest of the room stays scrollable. */
    pointer-events:none;
    visibility:hidden;

    /* This box's own size, in units the children can do arithmetic with.
       Container units rather than vw/vh so they measure THIS element: on a
       phone with a retracting URL bar the viewport and the fixed layer are
       not the same box, and it is this one the picture fills. The vw/vh
       pair is the fallback where container units are unavailable — off by
       whatever the URL bar is worth, which is a nudge, not a break. */
    --room-vw:100vw;
    --room-vh:100vh;
  }
  @supports (width:1cqw){
    #room-cta{
      container-type:size;
      --room-vw:100cqw;
      --room-vh:100cqh;
    }
  }
  #room-cta[data-live]{ visibility:visible; }
  #room-cta[data-live] .room-cta-btn{ pointer-events:auto; }

  /* The picture's own box: exactly the rectangle object-fit:cover paints
     the still into, overflow and all. max() picks the side that has to
     overflow in order to cover, and the centring does the rest — the same
     framing rule the image and blit() both follow. So a percentage inside
     this box is a percentage of the STILL at every viewport ratio, which is
     what keeps a plate on its panel as the crop changes under it. */
  .room-cta-fit{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:max(var(--room-vw), calc(var(--room-vh) * var(--room-ar)));
    height:max(var(--room-vh), calc(var(--room-vw) / var(--room-ar)));
  }

  /* The plate. Style, face and behaviour are as they were on the centred
     row; only where it sits and how big it is have changed.

     Position is the panel coordinate, with a clamp for the screen's own
     edge: 50% is the middle of the picture and --room-vw/2 is half the
     screen, so `50% - var(--room-vw)/2` is exactly where the left edge of
     the screen falls on the picture, and the plate is kept that far in plus
     its own half-width and the margin. It is slack — the anchor is used
     exactly as given — on anything wide enough for the crop to leave the
     whole panel on screen. A tall phone is not: at 9:19.5 cover takes 9% off
     each side, which is most of both panels, and the clamp is then the only
     thing keeping a plate that is wider than what is left of its panel from
     hanging off the glass. */
  .room-cta-btn{
    position:absolute;
    left:clamp(
      calc(50% - var(--room-vw) / 2 + var(--room-cta-w) / 2 + var(--room-cta-edge) + env(safe-area-inset-left, 0px)),
      var(--room-cta-x),
      calc(50% + var(--room-vw) / 2 - var(--room-cta-w) / 2 - var(--room-cta-edge) - env(safe-area-inset-right, 0px)));
    top:clamp(
      calc(50% - var(--room-vh) / 2 + var(--room-cta-h) / 2 + var(--room-cta-edge) + env(safe-area-inset-top, 0px)),
      var(--room-cta-y),
      calc(50% + var(--room-vh) / 2 - var(--room-cta-h) / 2 - var(--room-cta-edge) - env(safe-area-inset-bottom, 0px)));
    transform:translate(-50%,-50%);

    display:flex;
    align-items:center;
    justify-content:center;
    width:var(--room-cta-w);
    height:var(--room-cta-h);
    /* The label breaks between its two words and both lines are centred on
       the plate's axis. 1.5 rather than the face's own leading: the two
       lines have to look placed, not wrapped. */
    text-align:center;
    line-height:1.5;

    /* Written by the script, from the room's opacity. 0 until then, so a
       page where nothing runs shows no buttons over no room. Deliberately
       not in the transition below: the fade is the scroll position, not a
       reaction to it. */
    opacity:var(--room-cta-fade, 0);

    font-family:"Cormorant Garamond", "Frank Ruhl Libre", Georgia, serif;
    font-size:var(--room-cta-fs);
    font-weight:500;
    letter-spacing:.18em;
    direction:rtl;
    cursor:pointer;
    color:#d9bd77;
    border:1px solid rgba(199,162,74,.45);
    border-radius:1px;
    background:linear-gradient(177deg, rgba(214,182,110,.09), rgba(199,162,74,.015) 55%, rgba(0,0,0,.06));
    text-shadow:0 1px 1px rgba(0,0,0,.55);
    box-shadow:
      inset 0 1px 0 rgba(214,182,110,.14),
      inset 0 -1px 0 rgba(0,0,0,.28);
    transition:
      color .6s cubic-bezier(.22,.61,.36,1),
      border-color .6s,
      box-shadow .6s,
      background .6s;

    /* These three are not styling decisions, they are what makes the above
       hold on a link on a phone: no underline under the label, no break in
       the middle of it, and no grey flash on the tap. */
    text-decoration:none;
    white-space:nowrap;
    -webkit-tap-highlight-color:transparent;
  }

  /* The plaque is small on purpose; the tap does not have to be. This grows
     the hit box out to 44px tall and a little wider without touching a
     pixel of what is drawn. */
  .room-cta-btn::after{
    content:'';
    position:absolute;
    inset:min(0px, calc((44px - var(--room-cta-h)) / -2)) -8px;
  }

  .room-cta-btn--left { --room-cta-x:var(--room-cta-left-x);  --room-cta-y:var(--room-cta-left-y); }
  .room-cta-btn--right{ --room-cta-x:var(--room-cta-right-x); --room-cta-y:var(--room-cta-right-y); }

  /* Lit — the same four properties whichever way it is reached: a pointer
     over it, a finger on it, or the keyboard. Hover is asked for rather
     than assumed, because on a touch screen it latches after the finger
     has gone and the plate would be left lit behind it. */
  .room-cta-btn:active,
  .room-cta-btn:focus-visible{
    color:#f4e4b2;
    border-color:rgba(220,190,120,.9);
    background:linear-gradient(177deg, rgba(214,182,110,.16), rgba(199,162,74,.04) 55%, rgba(0,0,0,.05));
    box-shadow:
      inset 0 1px 0 rgba(220,190,120,.22),
      inset 0 -1px 0 rgba(0,0,0,.25),
      0 0 20px rgba(199,162,74,.22);
  }
  @media (hover:hover){
    .room-cta-btn:hover{
      color:#f4e4b2;
      border-color:rgba(220,190,120,.9);
      background:linear-gradient(177deg, rgba(214,182,110,.16), rgba(199,162,74,.04) 55%, rgba(0,0,0,.05));
      box-shadow:
        inset 0 1px 0 rgba(220,190,120,.22),
        inset 0 -1px 0 rgba(0,0,0,.25),
        0 0 20px rgba(199,162,74,.22);
    }
  }

  /* Only for the keyboard, and on top of the lit state above: the ring is
     what says which of the two is about to be opened. */

    outline:1px solid rgba(220,190,120,.9);
    outline-offset:3px;
  }

  @media (prefers-reduced-motion:reduce){
    #load{ transition:none; }
    /* The reveal is deliberately NOT reduced here, and this time there is
       nothing in it to reduce: the sweep moves no pixels. It is a colour
       boundary travelling along the x axis and an opacity fade on the
       Hebrew line — no transform, no parallax, no zoom, and nothing that
       tracks the scroll. That is not the class of motion this setting
       exists to temper, and the reveal is the only thing announcing the
       hero, so it has to read the same either way. */
  }
</style>
</head>
<body>

<div id="stage"><canvas id="frame"></canvas></div>
<div id="load"></div>

<div id="hero">
  <h1 class="hero-sr">Welcome to Netora</h1>
  <p class="hero-sr">Here we turn dreams into reality</p>
  <p class="hero-sr" lang="he" dir="rtl">לצפייה בעבודות שלנו ↓</p>

  <!-- Each English line is two stacked layers: the ink span, which carries
       the gradient the sweep slides across, and a ::before drawn from
       data-text, which carries the shadows and nothing else. Both are

       more, and so nothing that can be left half-written. -->
  <div id="hero-type" aria-hidden="true">

    </div>
    <div class="hero-line hero-l2" data-text="Here we turn dreams into reality">

    </div>
    <div class="hero-arrow" lang="he" dir="rtl">לצפייה בעבודות שלנו ↓</div>
  </div>
</div>

<!-- Decorative, and above the hero it dissolves over, so it is hidden from
     assistive tech: there is nothing here the words below have not said.
     Low fetch priority so it queues behind the frames — nothing needs it
     until 1030vh of scrolling have gone by. -->
<img id="treasure" src="images/treasure-room.jpg" alt="" aria-hidden="true"
     decoding="async" fetchpriority="low">

     plate centred on each of the blue side panels. Where they sit is entirely in the
     stylesheet above; when they are live is entirely in the module below
     the cross-fade. Placeholder destinations for now — the two hrefs are
     the only things here that need swapping for the real links. -->

  <div class="room-cta-fit">
    <a class="room-cta-btn room-cta-btn--left" lang="he" dir="rtl"
       href="https://example.com" target="_blank" rel="noopener noreferrer">לצפייה<br>באתר</a>
    <a class="room-cta-btn room-cta-btn--right" lang="he" dir="rtl"
       href="https://example.com" target="_blank" rel="noopener noreferrer">לצפייה<br>באתר</a>
  </div>
</div>

<!-- GSAP 3.15.0, vendored (dist file from the gsap npm package, GreenSock
     standard no-charge license). Local rather than a CDN so the reveal has
     exactly one way to fail — the same way the rest of the page fails — and
     one version, pinned by the file. SplitText went with the type-on it
     drove: the sweep animates one number, not one span per letter. -->
<script src="vendor/gsap/gsap.min.js"></script>

<script>
/* The hero reveal is played, not scrubbed — on every arrival at the rotunda.

   The reveal this replaces was scrubbed: it wrote opacity, transform and
   blur onto every word on every paint, straight from the scroll position.
   That contract — state as a pure function of position — quietly depended
   on the position being sampled at rest, and iOS WebKit does not promise
   that: scroll events are coalesced during a momentum fling, and the last
   one delivered can land while the page is still moving. Words were left
   half-written, blurred, with no further event ever coming to finish them.

   So position is no longer something the text is a function of. It is read
   as one bit — is the page standing in the rotunda, or is it not — and the
   sweep runs start to finish on GSAP's clock each time that bit goes true.
   A missed or early scroll sample can at worst flip it a frame late, and
   the sweep then still plays whole.

   Nothing here is ever run backwards. Leaving hides the block; arriving
   rewinds the sweep to unlit and plays it forward again, whichever end the
   page arrived from — down out of the entry clip, or up out of the treasure
   room. A reveal caught half-way through by a reversal is not resumed or
   reversed, it is simply restarted from nothing by the next arrival, so
   there is no half-finished state for a fast back-and-forth to jam on.
   Hiding is atomic by construction, too: one autoAlpha write on #hero-type,
   a single property on a single element, takes the whole block off screen
   whatever the sweep left behind it.

   The two bits are latched against a band with a margin around it, not a
   line: the page has arrived once it is properly inside the rotunda's own
   stretch of the track and has left only once it is properly outside. The
   gap between those two is what stops a scroll resting on the boundary, or
   a rubber-band overshoot, from firing the reveal over and over.

   And because a fast scroller would otherwise fly straight past the
   rotunda, the FIRST arrival takes the scroll with it: the page is pinned
   for the length of the sweep plus a short hold, then let go. Only the
   first — a pin that came back every time somebody scrolled up and down
   would stop being a courtesy and start being a cage. Later arrivals re-run
   the sweep and leave the scroll alone. */
(function () {
  'use strict';

  /* ---- the rotunda's stretch of the track, in vh of scroll travel ----

     Same units as the ledger in the stylesheet: the frames finish at 750vh
     and the rotunda is simply held from there, the treasure room starts
     dissolving over it at 1030vh, and the track ends at 1130vh.

     ARRIVE is that held stretch exactly — its lower end is the frame the
     entry clip settles on, its upper end the last position where the
     rotunda is still the whole picture. LEAVE is the same band with a
     margin: 30vh further back into the pull-out, where the camera is
     visibly moving again, and 50vh further into the cross-fade, by which
     point the treasure room is two thirds of the way up and taking the
     words with it.

     Everything between the two is a dead zone that holds whatever the last
     answer was. Re-arming therefore costs a real gesture — a third of a
     screen at the near end — rather than the wobble at the end of a fling. */
  var SCRUB_VH     = 750;    // p is exactly 1.0 at 750vh; see the scrubber
  var ARRIVE_FROM  = 750;
  var ARRIVE_TO    = 1030;
  var LEAVE_BELOW  = 720;
  var LEAVE_ABOVE  = 1080;

  var SWEEP   = 1.05;   // the band crosses both English lines
  var ARROW   = 0.45;   // the Hebrew line fades in behind it — 1.5s in total
  var HOLD    = 0.70;   // lit, still pinned, so it is read before it can move
  var FUSE_MS = 4000;   // a pin still standing this long lets go by itself

  // The two ends of the band's travel, as background-position percentages.
  // See the stylesheet for why they are 84 and 12 rather than 100 and 0.
  var DARK = 84;
  var LIT  = 12;

  var wrap  = document.getElementById('hero-type');
  var arrow = wrap && wrap.querySelector('.hero-arrow');

  var lastP  = 0;       // latest position the scrubber handed over
  var inside = false;   // the latched bit: is the page standing in the rotunda?
  var pinned = false;   // the pin has been spent — it is a first-arrival thing
  var tl     = null;    // built below; settle() is inert until it exists

  // The scrubber captures window.NetoraHero synchronously when it starts,
  // so the contract object has to exist now. Until the timeline is built,
  // at() only records where the page is.
  window.NetoraHero = {
    at: function (p) { lastP = p; settle(); }
  };

  if (!wrap || !arrow || !window.gsap) return;

  /* ---------- the reveal ---------- */

  // GSAP tweens this one plain number and writeBand() turns it into the
  // gradient's position. Going through an object rather than tweening the
  // custom property directly keeps the single value the animation owns in
  // plain sight, and keeps the write to one setProperty of one number.
  var band = { at: DARK };

  function writeBand() {
    wrap.style.setProperty('--sweep', String(Math.round(band.at * 100) / 100));
  }

  // Unlit, and the Hebrew line down, before the block can ever be seen:
  // #hero-type is hidden by the stylesheet until arrive() shows it.
  function rewind() {
    band.at = DARK;
    writeBand();
    gsap.set(arrow, { autoAlpha: 0 });
  }
  rewind();

  tl = gsap.timeline({
    paused: true,
    onComplete: function () {
      // The hold is deliberately outside the timeline: what it delays is
      // letting go of the page, not anything on screen. Only asked for when
      // there is a pin to let go of — a re-play does not schedule anything.
      if (locked) gsap.delayedCall(HOLD, release);
    }
  });

  tl.to(band, {
      at: LIT,
      duration: SWEEP,
      ease: 'power1.inOut',
      onUpdate: writeBand
    }, 0)
    .to(arrow, {
      autoAlpha: 1,
      duration: ARROW,
      ease: 'power1.out'
    }, SWEEP);

  /* ---------- the pin ---------- */

  var locked = false;
  var lockY  = 0;      // where the pin holds the page, in pixels
  var lockAt = 0;      // ... and the same place as a fraction of the track
  var fuse   = 0;

  // space, page up/down, end, home, arrow up/down
  var KEYS = { 32:1, 33:1, 34:1, 35:1, 36:1, 38:1, 40:1 };

  // Zooming is left alone — a two-finger pinch, or ctrl+wheel. The pin is
  // here to stop the page being scrolled past the reveal, not to stop
  // somebody making the words bigger while they read them.
  function swallow(e) {
    if (e.ctrlKey || (e.touches && e.touches.length > 1)) return;
    e.preventDefault();
  }
  function swallowKey(e) { if (KEYS[e.keyCode]) e.preventDefault(); }

  // Momentum already in flight cannot be preventDefault()ed — the finger is
  // off the glass and no more touchmoves are coming — so the position is
  // written back as well. The scrubber's own scroll listener sees these
  // writes and repaints the same held frame, which is a no-op for it, and
  // the hero reads the same p it already latched on.
  //
  // A pixel of tolerance, not equality. scrollY is a double and the value a
  // scrollTo actually lands on can be snapped to the device pixel grid, so
  // an exact compare can be false forever — and this runs from the scroll
  // event its own write raises. A pixel is far below anything a visitor can
  // see and far above any rounding.
  function repin() {
    if (locked && Math.abs(window.scrollY - lockY) > 1) window.scrollTo(0, lockY);
  }

  // The track is 1230vh, so its length in pixels is a function of the
  // viewport: a rotation re-resolves the whole thing, and the browser clamps
  // the old absolute offset into the new range — on a phone that lands at
  // the very bottom of the site, under a fully opaque treasure room, with
  // the reveal playing where nobody can see it. So what the pin remembers is
  // where it is in the TRACK, and the pixel offset is re-derived from that
  // whenever the track changes. Applied at once rather than waiting for a
  // scroll event, since the resize itself is the movement.
  function trackMax() {
    return document.documentElement.scrollHeight - window.innerHeight;
  }

  function restake() {
    var max = trackMax();
    lockY = max > 0 ? lockAt * max : 0;
    repin();
  }

  function hold() {
    if (locked) return;
    locked = true;
    lockY = window.scrollY;
    lockAt = trackMax() > 0 ? lockY / trackMax() : 0;
    document.documentElement.classList.add('hero-locked');
    window.addEventListener('touchmove', swallow,    { passive: false });
    window.addEventListener('wheel',     swallow,    { passive: false });
    window.addEventListener('keydown',   swallowKey, false);
    window.addEventListener('scroll',    repin,      { passive: true });
    window.addEventListener('resize',            restake);
    window.addEventListener('orientationchange', restake);
    // A page the visitor cannot scroll is the worst thing this file could
    // leave behind, so letting go does not depend on the timeline getting
    // there: if the clock stalls — a backgrounded tab, a dropped frame
    // chain — this releases anyway.
    fuse = setTimeout(release, FUSE_MS);
  }

  function release() {
    if (!locked) return;
    locked = false;
    clearTimeout(fuse);
    document.documentElement.classList.remove('hero-locked');
    window.removeEventListener('touchmove', swallow);
    window.removeEventListener('wheel',     swallow);
    window.removeEventListener('keydown',   swallowKey);
    window.removeEventListener('scroll',    repin);
    window.removeEventListener('resize',            restake);
    window.removeEventListener('orientationchange', restake);
    // depart() has been declining to act for as long as this was up. Ask it
    // once now, rather than leaving the block's fate to whenever the next
    // paint happens to come — the scrubber's rAF chain retires 700ms after
    // the last movement, and a pinned page has not moved.
    settle();
  }

  /* ---------- arrival and departure ---------- */

  function arrive() {
    inside = true;
    gsap.killTweensOf(wrap);            // a hide still fading is cancelled, not raced
    gsap.set(wrap, { autoAlpha: 1 });

    // Unlit again in the same JS turn as the un-hide, so there is no frame
    // in between for the previous reveal's finished text to flash through —
    // and play(0) then renders that same time zero and runs it forward.
    // Written here as well as by the timeline because "reset to unlit" is
    // the thing being asked for, not a side effect of a seek.
    rewind();
    tl.play(0);

    if (!pinned) {
      pinned = true;                    // latched before the call: once per load
      hold();
    }
  }

  function depart() {
    inside = false;
    // The timeline is left to finish where nobody can see it rather than
    // paused mid-flight: there is then no partly-rendered reveal for the
    // next arrival to have to reason about, only one that starts at zero.
    gsap.to(wrap, {
      autoAlpha: 0,
      duration: 0.18,
      ease: 'power1.out',
      overwrite: 'auto'
    });
  }

  function settle() {
    if (!tl) return;

    var at = lastP * SCRUB_VH;          // where the page is, in vh of travel

    if (!inside) {
      if (at >= ARRIVE_FROM && at <= ARRIVE_TO) arrive();
    } else if (!locked && (at < LEAVE_BELOW || at > LEAVE_ABOVE)) {
      // Not while pinned. p is scrollY over a track measured in vh, so a
      // viewport that changes under the pin — a rotation — can move p
      // without the page having moved at all, and the one thing that must
      // not happen during the reveal is the reveal being hidden.
      depart();
    }
  }
})();
</script>

<script>
/* The treasure room is dissolved in, not played.

   Same contract as the hero above it: the opacity is a pure function of
   scroll position, written straight from the scrubber on every paint.
   There is no timer, no transition and no latched state, so scrolling back
   up simply evaluates the same arithmetic at a smaller number and the room
   fades back out, uncovering the rotunda and the words. Stopping mid-way
   leaves it wherever the scroll left it. Reversal is not a feature that has
   to work; it is the same sum read backwards. */
(function () {
  'use strict';

  /* ---- the two knobs, both in vh of scroll travel ----

     Travel is measured from the top of the page in the same units as the
     ledger in the stylesheet: the frames finish at 750vh, the reveal plays
     itself out on its own clock from there, the hero rests until 1030vh,
     and the track ends at 1130vh (1230vh of body, less the 100vh viewport
     that never scrolls past). So the fade below starts the moment the
     finished hero has had its full rest and closes 20vh short of the
     bottom, leaving the room held at full opacity for the landing.

     These two are the only numbers to touch. The frames and the words are
     anchored to their own and do not read these. */
  var FADE_START_VH = 1030;
  var FADE_LEN_VH   = 80;

  // The scrubber hands over p, which is exactly 1.0 when the frames finish
  // at 750vh of travel — so p * 750 is that travel back in vh, whatever the
  // track below it is doing.
  var SCRUB_VH = 750;

  // Guarded so that setting the length to 0 above degenerates to a hard cut
  // at FADE_START_VH rather than to a NaN opacity.
  var LEN = FADE_LEN_VH > 0 ? FADE_LEN_VH : 1e-6;

  var el = document.getElementById('treasure');
  if (!el) return;

  var last = -1;                                  // last value written
  var seen = 0;                                   // last p handed over

  // The layer is only allowed up once there is something in it to see. If
  // the picture is late, or never arrives at all, the rotunda keeps the
  // screen rather than an empty rectangle dissolving over it.
  //
  // Asked as a question, not just listened for: the <img> sits earlier in
  // the document than this script, and the webfont stylesheet in the head
  // blocks inline script execution, so a fast failure — a 404 off the same
  // origin — can be over and done with before an 'error' listener here
  // could ever have caught it.
  function usable() {
    return el.complete && el.naturalWidth > 0;
  }

  function ease(t) {                              // smoothstep
    return t * t * (3 - 2 * t);
  }

  function write(p) {
    seen = p;

    var t = usable() ? (p * SCRUB_VH - FADE_START_VH) / LEN : 0;
    t = t < 0 ? 0 : (t > 1 ? 1 : t);
    t = Math.round(t * 1000) / 1000;
    if (t === last) return;
    last = t;

    el.style.opacity = ease(t);
  }

  // A picture that lands while the page is standing still is not a special
  // case: run the same sum again at the position the page is already at.
  // Without this the layer would wait for the next scroll event to notice.
  el.addEventListener('load',  function () { write(seen); });
  el.addEventListener('error', function () { write(seen); });

  // p comes straight from the scrubber and is not clamped — 1.0 is the frame
  // scrub finishing, and the fade lives well above that.
  window.NetoraTreasure = { at: write };
})();
</script>

<script>
/* When the two glass plates are live.

   The buttons have no scroll state of their own, and no second copy of the
   fade's arithmetic. The room's opacity IS the state: it is zero for as
   long as the room is not on screen, it leaves zero the moment the dissolve
   starts, and it comes back to zero if the page is scrolled back up out of
   it. So this reads that one number after every write and hands it on —
   into --room-cta-fade, which the plates use as their opacity, and into
   data-live, which is what gives them their pointer events and takes them
   out of the tab order again afterwards.

   Reading it means the fade above keeps both of its knobs and stays the
   only thing that knows where the cross-fade starts or how long it runs.
   Move them and the buttons follow, because there is nothing here to move.

   It decorates .at rather than being called by it, for the same reason: the
   scrubber looks that property up on this object on every paint, so
   wrapping it runs this immediately after every opacity the fade writes,
   without the fade having been told the buttons exist. */
(function () {
  'use strict';

  /* How far up the room has to be before the plates will take a tap. Zero
     is "from the instant the dissolve starts", which is what the room asks
     for: they are live across the whole of it, going down and coming back
     up. Raise it — .25, say — to keep them inert until the picture is
     properly there. It is the only number in this module. */
  var LIVE_ABOVE = 0;

  var room = document.getElementById('treasure');
  var cta  = document.getElementById('room-cta');
  var fade = window.NetoraTreasure;
  if (!room || !cta || !fade) return;

  var last = -1;                                  // last value passed on

  function follow() {
    // '' until the fade's first write, and a string after it.
    var op = parseFloat(room.style.opacity);
    if (!(op > 0)) op = 0;
    if (op === last) return;
    last = op;

    cta.style.setProperty('--room-cta-fade', String(op));

    // Live for as long as the room is on screen — the whole dissolve
    // included, where the picture is up but still coming through.
    if (op > LIVE_ABOVE) cta.setAttribute('data-live', '');
    else cta.removeAttribute('data-live');
  }

  var at = fade.at;
  fade.at = function (p) { at(p); follow(); };

  // The still is fetched at low priority and can land after the page has
  // stopped moving. The fade re-runs itself on its own load handler — added
  // before this one, so it has already written by the time this reads — and
  // the paint loop has retired by then, so nothing else would ask again.
  room.addEventListener('load',  follow);
  room.addEventListener('error', follow);

  follow();
})();
</script>

<script>
(function () {
  'use strict';

  // One timeline across two clips: the vault door opens, then the camera
  // carries through the doorway into the rotunda.
  //
  //   timeline 0..47    vault-open    frames/frame-001..048
  //   timeline 48..118  entrance      frames-entrance/frame-002..072
  //
  // The entrance clip's own frame-001 is the same picture as vault
  // frame-048 — it is the seam the two shots were cut on. It stays in the
  // folder so that sequence stands alone, but it is skipped here: spending
  // a scroll step repainting an identical frame would read as a stall at
  // the exact moment the camera should start moving.
  var VAULT = 48;
  var COUNT = 119;

  // Fraction of the scroll track that drives frames. 750 of the 1130vh of
  // travel scrubs; the rest carries the hero reveal, its end hold and the
  // treasure cross-fade. The frames still finish at exactly 750vh, as they
  // always have — only the denominator moved, because the track below them
  // grew.
  var SCRUB = 750 / 1130;

  var stage  = document.getElementById('stage');
  var canvas = document.getElementById('frame');
  var bar    = document.getElementById('load');
  var ctx    = canvas.getContext('2d', { alpha: false });

  var hero    = window.NetoraHero;
  var chamber = window.NetoraTreasure;

  var images  = new Array(COUNT);
  var loaded  = 0;
  var ready   = false;
  var drawn   = -1;   // frame index currently painted

  // Paint-loop state — see schedule() below.
  var running  = false;   // a tick chain is (believed) alive
  var lastY    = -1;      // scrollY as of the last tick
  var movedAt  = 0;       // when the position last changed
  var tickedAt = 0;       // when the chain last ran, for the watchdog

  function pad(n) {
    return String(n).padStart(3, '0');
  }

  function srcFor(i) {
    return i < VAULT
      ? 'frames/frame-' + pad(i + 1) + '.jpg'
      : 'frames-entrance/frame-' + pad(i - VAULT + 2) + '.jpg';
  }

  /* ---------- painting ---------- */

  // Size the backing store to the viewport, but never ask for more pixels
  // than the source frames actually contain — both clips are 720x1280, so
  // going beyond that just burns memory for no visible detail.
  function resize() {
    var cssW = stage.clientWidth;
    var cssH = stage.clientHeight;
    if (!cssW || !cssH) return;

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.round(cssW * dpr);
    var h = Math.round(cssH * dpr);

    var cap = 1280 * 1280;                       // pixel budget
    var area = w * h;
    if (area > cap) {
      var k = Math.sqrt(cap / area);
      w = Math.round(w * k);
      h = Math.round(h * k);
    }

    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      drawn = -1;                                // force a repaint
    }
    paint();
  }

  // cover: fill the canvas, preserve aspect, centre the overflow
  function blit(img) {
    var cw = canvas.width;
    var ch = canvas.height;
    var iw = img.naturalWidth;
    var ih = img.naturalHeight;
    if (!iw || !ih) return;

    var s = Math.max(cw / iw, ch / ih);
    var w = iw * s;
    var h = ih * s;
    ctx.drawImage(img, (cw - w) / 2, (ch - h) / 2, w, h);
  }

  function progress() {
    var max = document.documentElement.scrollHeight - window.innerHeight;
    if (max <= 0) return 0;
    var p = window.scrollY / max;
    // iOS rubber-banding can overshoot in both directions
    return p < 0 ? 0 : p > 1 ? 1 : p;
  }

  function paint() {
    // Until every frame is decoded, hold on the closed door rather than
    // showing gaps — this is what keeps scrubbing flicker-free later.
    var idx = 0;
    var p = 0;
    if (ready) {
      p = progress() / SCRUB;
      idx = Math.round((p > 1 ? 1 : p) * (COUNT - 1));   // frames still clamp
    }

    // The hero and the treasure room read the same progress, unclamped: p
    // is exactly 1 when the frames finish, and everything past that is
    // theirs to spend. Above the early-out, which returns once the held
    // frame is painted.
    if (hero) hero.at(p);
    if (chamber) chamber.at(p);

    if (idx === drawn) return;

    var img = images[idx];
    if (!img || !img.complete || !img.naturalWidth) return;

    drawn = idx;
    blit(img);
  }

  /* One scroll event used to buy exactly one rAF paint. On iOS that is not
     enough: WebKit delivers scroll events sparsely during a momentum fling,
     and the last one it sends can land while the page is still moving — so
     the final paint sampled an intermediate position, and whatever the
     reveal had half-written there stayed on screen until the next gesture.
     The state is a pure function of position; it was the sampling that
     stopped early.

     So an event no longer buys a paint, it buys a watch: a rAF chain that
     paints from the live position every frame and only lets go once the
     page has not moved for SETTLE_MS. A fling keeps refreshing movedAt all
     the way down, however few events WebKit sends, and the chain's closing
     paints are, by construction, at the settled position. Repainting an
     unchanged position costs a handful of compares — every layer under
     paint() early-outs on its own memo.

     The watchdog covers the other way to stall: if the chain's next frame
     never comes back (a callback frozen in a background tab, a dropped
     request), the next event notices the silence and starts a fresh chain.
     If two chains ever raced, they would repaint the same numbers and
     retire at the same deadline — idempotent, so harmless. */
  var SETTLE_MS   = 700;    // keep watching this long after the last movement
  var WATCHDOG_MS = 2000;   // declare a silent chain dead after this long

  function tick(now) {
    tickedAt = now;

    var y = window.scrollY;
    if (y !== lastY) { lastY = y; movedAt = now; }

    paint();

    if (now - movedAt > SETTLE_MS) { running = false; return; }
    requestAnimationFrame(tick);
  }

  function schedule() {
    movedAt = performance.now();          // the event itself counts as movement
    if (running && movedAt - tickedAt < WATCHDOG_MS) return;
    running = true;
    requestAnimationFrame(tick);
  }

  /* ---------- preload ---------- */

  function load(i) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.decoding = 'async';

      function settle() {
        loaded++;
        bar.style.width = (loaded / COUNT * 100) + '%';
        resolve();
      }

      img.onload = function () {
        // Decode up front so the first paint of each frame is instant.
        // Keep plain <img> rather than ImageBitmap: the browser may evict
        // a decoded frame under memory pressure and silently re-decode
        // from cache, instead of the tab being killed outright.
        if (img.decode) {
          img.decode().then(function () {
            images[i] = img;
            settle();
          }, function () {
            images[i] = img;
            settle();
          });
        } else {
          images[i] = img;
          settle();
        }
      };

      img.onerror = function () {
        images[i] = null;
        settle();
      };

      img.src = srcFor(i);
    });
  }

  function start() {
    resize();

    // Frame 1 first, so the closed door is on screen almost immediately
    // instead of a black hold while the rest streams in.
    load(0).then(function () {
      paint();

      // Requested in timeline order, so the frames the viewer reaches
      // first are also the ones the browser fetches first.
      var rest = [];
      for (var i = 1; i < COUNT; i++) rest.push(load(i));

      return Promise.all(rest);
    }).then(function () {
      ready = true;
      bar.classList.add('done');
      drawn = -1;
      paint();
    });
  }

  window.addEventListener('scroll', schedule, { passive: true });
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  // A bfcache restore can bring back a scroll position with a stale canvas.
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) { drawn = -1; paint(); }
  });

  start();
})();
</script>
