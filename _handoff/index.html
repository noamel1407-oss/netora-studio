<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NETORA — depth parallax test</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:auto}
  body{background:#0C1B33;font-family:Heebo,system-ui,-apple-system,sans-serif;overscroll-behavior-y:none}
  #stage{position:fixed;inset:0;z-index:0}
  #stage canvas{display:block;width:100%;height:100%}
  #scroll{height:500vh;position:relative;z-index:1;pointer-events:none}
  #copy{position:fixed;inset:0;z-index:2;pointer-events:none;
        display:flex;flex-direction:column;justify-content:center;align-items:flex-end;
        padding:0 6vw;opacity:0;transition:opacity .6s ease}
  #copy h1{color:#F7F2E8;font-weight:700;line-height:1.15;letter-spacing:.01em;
           font-size:clamp(28px,4.2vw,64px);text-shadow:0 2px 30px rgba(12,27,51,.45)}
  #copy h1 .sky{color:#8FB7E8}
  #copy h1 .gold{color:#C9A24B}
  #copy p{color:#F7F2E8;opacity:.9;margin-top:.8em;font-weight:300;
          font-size:clamp(14px,1.5vw,22px);line-height:1.5;max-width:22em;
          text-shadow:0 2px 24px rgba(12,27,51,.5)}
  #err{position:fixed;inset:0;z-index:5;display:none;place-items:center;padding:8vw;
       color:#F7F2E8;background:#0C1B33;font-size:15px;line-height:1.7;text-align:center}
  /* tuning panel */
  #tune{position:fixed;bottom:0;left:0;right:0;z-index:9;background:rgba(12,27,51,.92);
        color:#F7F2E8;padding:10px 14px 14px;font-size:12px;
        transform:translateY(calc(100% - 34px));transition:transform .25s ease}
  #tune.open{transform:translateY(0)}
  #tune h4{font-size:12px;font-weight:500;letter-spacing:.08em;opacity:.75;
           height:24px;line-height:24px;cursor:pointer;text-align:center}
  #tune label{display:flex;align-items:center;gap:10px;margin-top:8px;direction:ltr}
  #tune label span{width:92px;opacity:.7;font-size:11px}
  #tune input{flex:1;accent-color:#C9A24B}
  #tune b{width:46px;text-align:right;font-weight:400;color:#C9A24B}
</style>
</head>
<body>

<div id="stage"></div>

<div id="copy">
  <h1>אנחנו בונים אתרים <span class="sky">תלת־ממדיים</span><br>שמשאירים <span class="gold">חותם</span></h1>
  <p>חוויות דיגיטליות יוקרתיות שמספרות סיפור ומובילות לפעולה</p>
</div>

<div id="scroll"></div>

<div id="err"></div>

<div id="tune">
  <h4 id="tuneToggle">כיוונון ▲</h4>
  <label><span>עומק</span><input id="sDepth" type="range" min="0" max="4" step="0.05" value="1.6"><b id="vDepth">1.60</b></label>
  <label><span>קדימה</span><input id="sDolly" type="range" min="0" max="4" step="0.05" value="1.60"><b id="vDolly">1.60</b></label>
  <label><span>הצידה</span><input id="sLat" type="range" min="-1.5" max="1.5" step="0.05" value="0.35"><b id="vLat">0.35</b></label>
  <label><span>החלקה</span><input id="sEase" type="range" min="0.02" max="0.30" step="0.01" value="0.09"><b id="vEase">0.09</b></label>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from 'three';

const COLOR_SRC = './hero.png';        // the clean hero frame
const DEPTH_SRC = './hero-depth.png';  // its depth map (white = near, black = far)
const IMG_ASPECT = 1672 / 941;

const FOV = 50;
const CAM_Z = 6;

const stage = document.getElementById('stage');
const copy  = document.getElementById('copy');
const errEl = document.getElementById('err');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x0C1B33);
const camera = new THREE.PerspectiveCamera(FOV, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0, CAM_Z);

const uniforms = {
  uMap:        { value: null },
  uDepth:      { value: null },
  uDepthScale: { value: 1.6 },
};

const material = new THREE.ShaderMaterial({
  uniforms,
  vertexShader: /* glsl */`
    uniform sampler2D uDepth;
    uniform float uDepthScale;
    varying vec2 vUv;
    void main() {
      vUv = uv;
      // depth map: 1.0 = nearest to camera, 0.0 = farthest
      float d = texture2D(uDepth, uv).r;
      vec3 p = position;
      p.z += d * uDepthScale;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    uniform sampler2D uMap;
    varying vec2 vUv;
    void main() {
      gl_FragColor = texture2D(uMap, vUv);
      #include <colorspace_fragment>
    }
  `,
});

// dense grid so the displacement reads as geometry, not as a few cards
const SEG_X = 400, SEG_Y = 225;
let mesh = null;

function buildPlane() {
  if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); }
  const vH = 2 * CAM_Z * Math.tan((FOV * Math.PI) / 360);
  const vW = vH * (innerWidth / innerHeight);
  let pW, pH;
  if (innerWidth / innerHeight > IMG_ASPECT) { pW = vW; pH = pW / IMG_ASPECT; }
  else { pH = vH; pW = pH * IMG_ASPECT; }
  pW *= 1.35; pH *= 1.35;               // overscan, so edges never enter frame
  const geo = new THREE.PlaneGeometry(pW, pH, SEG_X, SEG_Y);
  mesh = new THREE.Mesh(geo, material);
  scene.add(mesh);
}

const loader = new THREE.TextureLoader();
function load(src, srgb) {
  return new Promise((res, rej) => loader.load(src, t => {
    t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
    t.minFilter = THREE.LinearFilter;
    t.magFilter = THREE.LinearFilter;
    t.generateMipmaps = false;
    t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
    res(t);
  }, undefined, rej));
}

// ---- tuning panel ----
const P = { depth: 1.6, dolly: 1.6, lat: 0.35, ease: 0.09 };
const bind = (id, vid, key, fmt = v => v.toFixed(2)) => {
  const s = document.getElementById(id), b = document.getElementById(vid);
  const set = () => { P[key] = parseFloat(s.value); b.textContent = fmt(P[key]);
                      if (key === 'depth') uniforms.uDepthScale.value = P.depth; };
  s.addEventListener('input', set); set();
};
bind('sDepth','vDepth','depth'); bind('sDolly','vDolly','dolly');
bind('sLat','vLat','lat');       bind('sEase','vEase','ease');
const tune = document.getElementById('tune');
document.getElementById('tuneToggle').addEventListener('click', () => tune.classList.toggle('open'));

// ---- scroll ----
let target = 0, current = 0;
function readScroll() {
  const max = document.body.scrollHeight - innerHeight;
  target = max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
}
addEventListener('scroll', readScroll, { passive: true });
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  buildPlane();
  readScroll();
});

function tick() {
  current += (target - current) * P.ease;
  // pure translation — never rotate. rotation is what makes it read as a pan.
  camera.position.z = CAM_Z - current * P.dolly;
  camera.position.x = current * P.lat;
  camera.position.y = 0;
  camera.rotation.set(0, 0, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

Promise.all([load(COLOR_SRC, true), load(DEPTH_SRC, false)])
  .then(([map, depth]) => {
    uniforms.uMap.value = map;
    uniforms.uDepth.value = depth;
    buildPlane();
    readScroll();
    tick();
    setTimeout(() => { copy.style.opacity = 1; }, 400);
  })
  .catch(() => {
    errEl.style.display = 'grid';
    errEl.innerHTML =
      'לא נמצאו הקבצים.<br><br>' +
      'צריך שני קבצים בתיקייה הזאת:<br>' +
      '<b>hero.png</b> — פריים ההירו הנקי<br>' +
      '<b>hero-depth.png</b> — מפת העומק שלו<br><br>' +
      'את מפת העומק מייצרים עם <b>make_depth.py</b>.';
  });
</script>
</body>
</html>
