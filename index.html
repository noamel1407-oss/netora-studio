<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Netora</title>
<link rel="preload" as="image" href="frames/frame-001.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Heebo:wght@500&display=swap">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }

  html{ background:#000; }

  body{
    /* The scroll track, in viewport heights:
         100  the viewport itself (never scrolls past)
         750  scrub travel — drives all 119 frames at the vault's original
              rate of ~6.36vh per frame, so the two shots read as one move
         200  hero dwell — the type-on plays itself when the scroll first
              arrives down here, on GSAP's clock rather than the scroll's,
              so this band is simply room to rest on while it reads
          80  end hold — the finished hero rests here
          80  treasure cross-fade — the treasure room is dissolved in over
              this, taking the rotunda and the words down with it
          20  landing — the room, fully opaque, simply held. Deliberately
              left empty: the portfolio picks up from it
       ------
        1230

       Everything above the cross-fade keeps the number it always had. The
       track grew underneath it, not around it: the frames still finish at
       750vh of travel and the treasure fade still starts at 1030vh. */
    background:#000;
    height:1230vh;
    overscroll-behavior-y:none;
  }

  #stage{
    position:fixed;
    inset:0;
    background:#000;
    overflow:hidden;
  }

  #frame{
    display:block;
    width:100%;
    height:100%;
  }

  /* hairline preload indicator — no text, fades out once every frame is in */
  #load{
    position:fixed;
    top:0; left:0;
    height:2px;
    width:0;
    background:#c8a04a;
    pointer-events:none;
    transition:width .18s linear, opacity .5s ease .2s;
    will-change:width;
  }
  #load.done{ opacity:0; }

  /* ---------- hero overlay ---------- */

  /* Rides on top of the rotunda while it holds still at the bottom of the
     track. Anchored to the viewport rather than to the picture: blit()
     covers, so on a wide screen only the middle band of the 9:16 frame is
     ever on show and "upper-left of the image" would sit off-screen. */
  #hero{
    position:fixed;
    top:0; left:0;
    z-index:2;
    /* Desktop keeps the whole block off the centre line; phones take more
       width below. Everything is in vw so the proportions hold at any size. */
    max-width:49vw;
    /* Vertical position is a readability decision, measured rather than
       chosen by eye — see the aspect-ratio rules below. This is the
       portrait value. */
    padding:
      calc(40vh + env(safe-area-inset-top))
      0 0
      max(6vw, calc(env(safe-area-inset-left) + 1rem));
    pointer-events:none;
    -webkit-font-smoothing:antialiased;
  }

  /* The animated copy, as one block. SplitText slices it into word and
     letter spans at run time and the type-on plays across the letters — but
     on the way OUT the letters are never touched: a single opacity +
     visibility write on this wrapper takes the whole sentence off screen in
     one go, whatever inline state the letter spans were left in. Hiding at
     the common ancestor is what makes "gone" atomic — nothing half-applied
     further down can reach the screen through an invisible parent. These
     two declarations are also the at-rest state, which is what shows (i.e.
     nothing) if the script never runs; visibility rather than display so
     the text still lays out and the webfonts are still fetched for it. */
  #hero-type{
    visibility:hidden;
    opacity:0;
  }

  /* Readability halo. The rotunda behind the type is not a flat backdrop —
     the light shaft off the oculus crosses right through the headline — so
     each glyph carries its own pool of darkness to sit in. Three stacked
     shadows at zero offset: a tight one that does the separating, a mid one
     that softens its edge, and a wide one that just lowers the whole area.
     No offset, so it reads as a halo rather than a drop shadow, and no
     single layer is opaque enough to look like an outline.

     Radii are in em and the rule is on the three line elements rather than
     on #hero, because em on the container would resolve against the
     container's font-size and the halo would come out the same absolute
     size on 66px type and 32px type. Tune the alphas to change strength. */
  .hero-l1,
  .hero-l2,
  .hero-arrow{
    text-shadow:
      0 0 .10em rgba(2, 6, 16, .66),
      0 0 .28em rgba(2, 6, 16, .56),
      0 0 .80em rgba(2, 6, 16, .45);
  }

  .hero-l1{
    /* The padding above puts the line BOX at 30vh; this lifts it by the
       leading and the gap above the capitals, so the glyph tops land there
       instead. In em, so it re-solves itself for each size regime. */
    margin-top:-.33em;
    font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-weight:500;
    font-size:4.6vw;
    line-height:1.1;
    letter-spacing:.006em;
    color:#b08d57;                                  /* bronze, after the statues */
  }
  /* The largest of the three — line 1 introduces it, this is the statement.
     Margins are in em so the gaps grow with the type they separate. */
  .hero-l2{
    margin-top:.7em;
    font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-weight:600;
    font-size:4.9vw;
    line-height:1.15;
    letter-spacing:.004em;
    color:#dde1e6;
  }

  /* fit-content so the RTL line still starts flush with the English ones:
     a full-width rtl block would push its text to the far right. */
  .hero-arrow{
    width:fit-content;
    max-width:100%;
    margin-top:2.6em;
    font-family:'Heebo', 'Arial Hebrew', Arial, sans-serif;
    font-weight:500;
    font-size:2.2vw;
    line-height:1.4;
    letter-spacing:.01em;
    color:rgba(200,160,74,.72);                     /* muted #c8a04a */
  }

  /* Phones run the reference scale itself: 8.8vw gives line 1 the 5.5vw
     cap-height, line 2 is 9vw and breaks of its own accord after "dreams",
     and the block is allowed 88vw. The two regimes cannot meet — a 5.5vw
     capital and a block inside 50vw are not simultaneously satisfiable at
     any width — so the step at 768px is the one the brief asks for, not an
     oversight. */
  @media (max-width:767.98px){
    #hero{ max-width:88vw; }
    .hero-l1{ font-size:8.8vw; }
    .hero-l2{ font-size:9vw; }
    .hero-arrow{ font-size:4vw; }
  }

  /* The real text, for assistive tech and for anything reading the page
     without running the reveal. The animated copy above is aria-hidden. */
  /* Where the block sits vertically is set by the picture, not by taste.
     blit() covers, so how much of the 9:16 still is on screen — and
     therefore where its band of lit arched windows lands — is a function of
     the viewport's aspect ratio, not its width. The windows occupy roughly
     22-36% of the frame's own height; the wider the viewport, the more of
     the top and bottom is cropped away and the higher that band rides.

     Measured on the rendered page at each of these ratios, these are the
     positions where no pixel behind any of the three lines is brighter than
     the text it carries:

       portrait      the windows sit mid-screen, and the dark dome above
                     them is too short for the block — lifting line 1 onto
                     it would drop line 2 straight onto the windows. The
                     block goes below them instead.
       1.0 - 1.45    the crop has pushed the windows up; 23vh clears them.
       wider         only a sliver of the window band survives at the very
                     top of the frame, so the block can ride high. */
  @media (min-aspect-ratio:1/1) and (max-aspect-ratio:29/20){
    #hero{ padding-top:calc(23vh + env(safe-area-inset-top)); }
  }
  @media (min-aspect-ratio:29/20){
    #hero{ padding-top:calc(15vh + env(safe-area-inset-top)); }
  }

  .hero-sr{
    position:absolute;
    width:1px; height:1px;
    margin:-1px; padding:0;
    overflow:hidden;
    clip:rect(0 0 0 0);
    clip-path:inset(50%);
    white-space:nowrap;
    border:0;
  }

  /* ---------- treasure room ---------- */

  /* The last picture, laid over everything: the rotunda, the hero words and
     the load hairline. Anchored to the viewport, like #stage below it, so
     the two pictures sit in register and the dissolve is a straight blend
     of one into the other rather than a slide.

     object-fit:cover is the same framing rule blit() applies to the frames:
     fill the viewport, keep the ratio, centre whatever overflows. So the
     9:16 still fills a wide screen without bars and without stretching.

     Opacity is written from the scroll position by script, on every paint.
     It starts at 0 here, which is also where it stays if the script never
     runs or the picture never arrives. No transition: the opacity is the
     scroll position, not a reaction to it.

     Deliberately no background colour. cover cannot leave a bar to fill, so
     one would only ever show while the picture is still on its way — and a
     black rectangle rising over the rotunda is a worse failure than the
     rotunda simply staying. */
  #treasure{
    position:fixed;
    /* One pixel of overshoot on every side, rather than inset:0. At inset:0
       the layer's own edge does not reliably reach the last device pixel
       column or row: measured across twelve viewport and pixel-ratio
       combinations, several leave a hairline of the rotunda showing down the
       edge of the screen once the room is fully up. Growing the box past the
       viewport puts that edge off-screen, and the crop below is then figured
       on a box two pixels larger — half a percent at phone size, which is
       nothing, and it holds at every ratio measured.
       The width and height have to grow with it: with them left at 100% the
       box would simply be shifted a pixel left and the seam would move to
       the other edge, which is worse. */
    inset:-1px;
    z-index:3;
    width:calc(100% + 2px);
    height:calc(100% + 2px);
    object-fit:cover;
    object-position:center;
    opacity:0;
    pointer-events:none;
    will-change:opacity;
  }

  @media (prefers-reduced-motion:reduce){
    #load{ transition:none; }
    /* The type-on is deliberately NOT reduced here. It cannot be relied on
       that a visitor has the setting off, and the type-on is the only thing
       announcing the hero, so it has to read the same either way. The motion
       it asks for is small and brief — each letter rises .35em over half a
       second, once, with no parallax, no zoom, no spin, and nothing that
       tracks the scroll — which is the low-risk end of what this setting
       exists to temper. */
  }
</style>
</head>
<body>

<div id="stage"><canvas id="frame"></canvas></div>
<div id="load"></div>

<div id="hero">
  <h1 class="hero-sr">Welcome to Netora</h1>
  <p class="hero-sr">Here we turn dreams into reality</p>
  <p class="hero-sr" lang="he" dir="rtl">↓ לצפייה בעבודות שלנו</p>

  <!-- Plain text on purpose. SplitText slices it into word and letter spans
       at run time, once the webfonts are in, and the type-on walks the
       letters in reading order — line 1, then line 2, then the Hebrew. -->
  <div id="hero-type" aria-hidden="true">
    <div class="hero-l1">Welcome to Netora</div>
    <div class="hero-l2">Here we turn dreams into reality</div>
    <div class="hero-arrow" lang="he" dir="rtl">↓ לצפייה בעבודות שלנו</div>
  </div>
</div>

<!-- Decorative, and above the hero it dissolves over, so it is hidden from
     assistive tech: there is nothing here the words below have not said.
     Low fetch priority so it queues behind the frames — nothing needs it
     until 1030vh of scrolling have gone by. -->
<img id="treasure" src="images/treasure-room.jpg" alt="" aria-hidden="true"
     decoding="async" fetchpriority="low">

<!-- GSAP 3.15.0 + SplitText, vendored (dist files from the gsap npm
     package, GreenSock standard no-charge license). Local rather than a
     CDN so the type-on has exactly one way to fail — the same way the
     rest of the page fails — and one version, pinned by the file. -->
<script src="vendor/gsap/gsap.min.js"></script>
<script src="vendor/gsap/SplitText.min.js"></script>

<script>
/* The hero type-on is played, not scrubbed.

   The reveal this replaces wrote opacity, transform and blur onto every
   word on every paint, straight from the scroll position. That contract —
   state as a pure function of position — quietly depended on the position
   being sampled at rest, and iOS WebKit does not promise that: scroll
   events are coalesced during a momentum fling, and the last one delivered
   can land while the page is still moving. Words were left half-written,
   blurred, with no further event ever coming to finish them.

   So position is no longer something the text is a function of; it is read
   as one bit — has the scroll arrived at the rotunda, or left it — and the
   animation between those two states runs once per arrival on GSAP's own
   clock, start to finish. A missed or early scroll sample can at worst flip
   that bit a frame late, and the type-on then still plays whole. Scrolling
   back up does not run anything backwards: leaving hides the block and
   rewinds the timeline while nobody can see it, and the next arrival types
   the sentence on again from nothing.

   Hiding is atomic by construction. The letters are never written on the
   way out — one autoAlpha write on #hero-type, a single property on a
   single element, takes the whole block off screen whatever inline state
   the letter spans are in. There is no per-letter cleanup to be interrupted
   mid-way, which is the residue class of bug this exists to end.

   Order of operations, per the SplitText manual: fonts first
   (document.fonts.ready), split second, animate third. Splitting against
   the fallback font measures the wrong glyphs and the pieces keep those
   positions — a known root cause of mis-set type — so the split is gated on
   the fonts even though autoSplit would also catch a late-landing font.
   autoSplit stays on as the safety net, and because the split is
   words+chars only — no absolutely-positioned lines — the spans wrap by
   ordinary line-breaking, so every viewport width, and the 768px regime
   change in the stylesheet, lays out right without any re-measuring. */
(function () {
  'use strict';

  // In the scrubber's units: p is exactly 1.0 the moment the frames finish
  // and the rotunda holds still, so that is the arrival. Departure is ~20vh
  // of travel back into the pull-out — about three frames of visible camera
  // motion — so the two thresholds cannot chatter against each other when
  // a scroll sits right on the boundary, and the vanish is masked by the
  // camera already moving.
  var ENTER_AT   = 1;
  var EXIT_BELOW = 1 - 20 / 750;

  var wrap  = document.getElementById('hero-type');

  var lastP = 0;       // latest position the scrubber handed over
  var shown = false;   // the one latched bit: is the block on screen?
  var tl    = null;    // current type-on; rebuilt whenever SplitText re-splits

  // The scrubber captures window.NetoraHero synchronously when it starts,
  // so the contract object has to exist now — before the fonts, before the
  // split. Until the timeline exists, at() only records where the page is;
  // the split then settles up, so a visitor already standing in the rotunda
  // when it lands still gets the type-on.
  window.NetoraHero = {
    at: function (p) {
      lastP = p;
      settle();
    }
  };

  if (!wrap || !window.gsap || !window.SplitText) return;
  gsap.registerPlugin(SplitText);

  function settle() {
    if (!shown && tl && lastP >= ENTER_AT) {
      shown = true;
      gsap.killTweensOf(wrap);            // a hide still fading is cancelled, not raced
      gsap.set(wrap, { autoAlpha: 1 });
      // play(0) renders time zero — every letter at its hidden start —
      // in the same JS turn as the un-hide above, so there is no frame in
      // between for the finished sentence to flash through.
      tl.play(0);
    } else if (shown && lastP < EXIT_BELOW) {
      shown = false;
      if (tl) tl.pause();                 // freeze a type-on caught mid-flight
      gsap.to(wrap, {
        autoAlpha: 0,
        duration: 0.18,
        ease: 'power1.out',
        overwrite: 'auto',
        // Rewound only once invisible. If a re-arrival kills this fade
        // first, its play(0) does the rewinding instead.
        onComplete: function () { if (tl) tl.pause(0); }
      });
    }
  }

  // One tween per line, letters staggered in reading order — which for the
  // Hebrew line IS right-to-left: the spans sit in logical order and the
  // rtl context lays them out, and Hebrew has no joining forms, so
  // per-letter spans render the same glyphs the plain text did. Rise and
  // fade only, no filter: a few dozen blurred elements is exactly the
  // compositing load mobile WebKit is worst at, and it is what the old
  // reveal kept leaving on screen.
  function typeOn(dur, stag) {
    return {
      autoAlpha: 0,
      y: '0.35em',
      duration: dur,
      ease: 'power2.out',
      stagger: stag,
      immediateRender: true    // letters sit at their hidden start from build time
    };
  }

  function build(self) {
    var line = function (sel) {
      return self.chars.filter(function (c) { return c.closest(sel); });
    };

    var t = gsap.timeline({
      paused: true,
      onComplete: function () {
        // The finished state is no inline state at all: clearing the
        // animated properties drops the letters back onto the stylesheet —
        // no transforms, no promoted surfaces, text rendered exactly as
        // specified — for the long dwell the sentence sits through.
        gsap.set(self.chars, { clearProps: 'transform,opacity,visibility' });
      }
    });

    t.from(line('.hero-l1'),    typeOn(0.55, 0.045), 0)
     .from(line('.hero-l2'),    typeOn(0.55, 0.030), '>-0.30')
     .from(line('.hero-arrow'), typeOn(0.45, 0.025), '>-0.20');

    return t;
  }

  // Fonts first, split second, animate third — see the header note.
  document.fonts.ready.then(function () {
    SplitText.create(['.hero-l1', '.hero-l2', '.hero-arrow'], {
      type: 'words,chars',     // words so wrapping stays word-wise; chars carry the type-on
      aria: 'none',            // the .hero-sr copy is the accessible text
      autoSplit: true,
      onSplit: function (self) {
        tl = build(self);
        if (shown) {
          // A re-split mid-dwell (a late font) rebuilds the spans bare; the
          // sentence is supposed to be up, so put it up whole, not re-typed.
          tl.progress(1);
        } else {
          settle();            // the page may already be standing in the rotunda
        }
        return tl;             // handed back so a re-split reverts it first
      }
    });
  });
})();
</script>

<script>
/* The treasure room is dissolved in, not played.

   Same contract as the hero above it: the opacity is a pure function of
   scroll position, written straight from the scrubber on every paint.
   There is no timer, no transition and no latched state, so scrolling back
   up simply evaluates the same arithmetic at a smaller number and the room
   fades back out, uncovering the rotunda and the words. Stopping mid-way
   leaves it wherever the scroll left it. Reversal is not a feature that has
   to work; it is the same sum read backwards. */
(function () {
  'use strict';

  /* ---- the two knobs, both in vh of scroll travel ----

     Travel is measured from the top of the page in the same units as the
     ledger in the stylesheet: the frames finish at 750vh, the last word
     lands at 950vh, the hero rests until 1030vh, and the track ends at
     1130vh (1230vh of body, less the 100vh viewport that never scrolls
     past). So the fade below starts the moment the finished hero has had
     its full rest and closes 20vh short of the bottom, leaving the room
     held at full opacity for the landing.

     These two are the only numbers to touch. The frames and the words are
     anchored to their own and do not read these. */
  var FADE_START_VH = 1030;
  var FADE_LEN_VH   = 80;

  // The scrubber hands over p, which is exactly 1.0 when the frames finish
  // at 750vh of travel — so p * 750 is that travel back in vh, whatever the
  // track below it is doing.
  var SCRUB_VH = 750;

  // Guarded so that setting the length to 0 above degenerates to a hard cut
  // at FADE_START_VH rather than to a NaN opacity.
  var LEN = FADE_LEN_VH > 0 ? FADE_LEN_VH : 1e-6;

  var el = document.getElementById('treasure');
  if (!el) return;

  var last = -1;                                  // last value written
  var seen = 0;                                   // last p handed over

  // The layer is only allowed up once there is something in it to see. If
  // the picture is late, or never arrives at all, the rotunda keeps the
  // screen rather than an empty rectangle dissolving over it.
  //
  // Asked as a question, not just listened for: the <img> sits earlier in
  // the document than this script, and the webfont stylesheet in the head
  // blocks inline script execution, so a fast failure — a 404 off the same
  // origin — can be over and done with before an 'error' listener here
  // could ever have caught it.
  function usable() {
    return el.complete && el.naturalWidth > 0;
  }

  function ease(t) {                              // smoothstep
    return t * t * (3 - 2 * t);
  }

  function write(p) {
    seen = p;

    var t = usable() ? (p * SCRUB_VH - FADE_START_VH) / LEN : 0;
    t = t < 0 ? 0 : (t > 1 ? 1 : t);
    t = Math.round(t * 1000) / 1000;
    if (t === last) return;
    last = t;

    el.style.opacity = ease(t);
  }

  // A picture that lands while the page is standing still is not a special
  // case: run the same sum again at the position the page is already at.
  // Without this the layer would wait for the next scroll event to notice.
  el.addEventListener('load',  function () { write(seen); });
  el.addEventListener('error', function () { write(seen); });

  // p comes straight from the scrubber and is not clamped — 1.0 is the frame
  // scrub finishing, and the fade lives well above that.
  window.NetoraTreasure = { at: write };
})();
</script>

<script>
(function () {
  'use strict';

  // One timeline across two clips: the vault door opens, then the camera
  // carries through the doorway into the rotunda.
  //
  //   timeline 0..47    vault-open    frames/frame-001..048
  //   timeline 48..118  entrance      frames-entrance/frame-002..072
  //
  // The entrance clip's own frame-001 is the same picture as vault
  // frame-048 — it is the seam the two shots were cut on. It stays in the
  // folder so that sequence stands alone, but it is skipped here: spending
  // a scroll step repainting an identical frame would read as a stall at
  // the exact moment the camera should start moving.
  var VAULT = 48;
  var COUNT = 119;

  // Fraction of the scroll track that drives frames. 750 of the 1130vh of
  // travel scrubs; the rest carries the hero reveal, its end hold and the
  // treasure cross-fade. The frames still finish at exactly 750vh, as they
  // always have — only the denominator moved, because the track below them
  // grew.
  var SCRUB = 750 / 1130;

  var stage  = document.getElementById('stage');
  var canvas = document.getElementById('frame');
  var bar    = document.getElementById('load');
  var ctx    = canvas.getContext('2d', { alpha: false });

  var hero    = window.NetoraHero;
  var chamber = window.NetoraTreasure;

  var images  = new Array(COUNT);
  var loaded  = 0;
  var ready   = false;
  var drawn   = -1;   // frame index currently painted

  // Paint-loop state — see schedule() below.
  var running  = false;   // a tick chain is (believed) alive
  var lastY    = -1;      // scrollY as of the last tick
  var movedAt  = 0;       // when the position last changed
  var tickedAt = 0;       // when the chain last ran, for the watchdog

  function pad(n) {
    return String(n).padStart(3, '0');
  }

  function srcFor(i) {
    return i < VAULT
      ? 'frames/frame-' + pad(i + 1) + '.jpg'
      : 'frames-entrance/frame-' + pad(i - VAULT + 2) + '.jpg';
  }

  /* ---------- painting ---------- */

  // Size the backing store to the viewport, but never ask for more pixels
  // than the source frames actually contain — both clips are 720x1280, so
  // going beyond that just burns memory for no visible detail.
  function resize() {
    var cssW = stage.clientWidth;
    var cssH = stage.clientHeight;
    if (!cssW || !cssH) return;

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.round(cssW * dpr);
    var h = Math.round(cssH * dpr);

    var cap = 1280 * 1280;                       // pixel budget
    var area = w * h;
    if (area > cap) {
      var k = Math.sqrt(cap / area);
      w = Math.round(w * k);
      h = Math.round(h * k);
    }

    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      drawn = -1;                                // force a repaint
    }
    paint();
  }

  // cover: fill the canvas, preserve aspect, centre the overflow
  function blit(img) {
    var cw = canvas.width;
    var ch = canvas.height;
    var iw = img.naturalWidth;
    var ih = img.naturalHeight;
    if (!iw || !ih) return;

    var s = Math.max(cw / iw, ch / ih);
    var w = iw * s;
    var h = ih * s;
    ctx.drawImage(img, (cw - w) / 2, (ch - h) / 2, w, h);
  }

  function progress() {
    var max = document.documentElement.scrollHeight - window.innerHeight;
    if (max <= 0) return 0;
    var p = window.scrollY / max;
    // iOS rubber-banding can overshoot in both directions
    return p < 0 ? 0 : p > 1 ? 1 : p;
  }

  function paint() {
    // Until every frame is decoded, hold on the closed door rather than
    // showing gaps — this is what keeps scrubbing flicker-free later.
    var idx = 0;
    var p = 0;
    if (ready) {
      p = progress() / SCRUB;
      idx = Math.round((p > 1 ? 1 : p) * (COUNT - 1));   // frames still clamp
    }

    // The hero and the treasure room read the same progress, unclamped: p
    // is exactly 1 when the frames finish, and everything past that is
    // theirs to spend. Above the early-out, which returns once the held
    // frame is painted.
    if (hero) hero.at(p);
    if (chamber) chamber.at(p);

    if (idx === drawn) return;

    var img = images[idx];
    if (!img || !img.complete || !img.naturalWidth) return;

    drawn = idx;
    blit(img);
  }

  /* One scroll event used to buy exactly one rAF paint. On iOS that is not
     enough: WebKit delivers scroll events sparsely during a momentum fling,
     and the last one it sends can land while the page is still moving — so
     the final paint sampled an intermediate position, and whatever the
     reveal had half-written there stayed on screen until the next gesture.
     The state is a pure function of position; it was the sampling that
     stopped early.

     So an event no longer buys a paint, it buys a watch: a rAF chain that
     paints from the live position every frame and only lets go once the
     page has not moved for SETTLE_MS. A fling keeps refreshing movedAt all
     the way down, however few events WebKit sends, and the chain's closing
     paints are, by construction, at the settled position. Repainting an
     unchanged position costs a handful of compares — every layer under
     paint() early-outs on its own memo.

     The watchdog covers the other way to stall: if the chain's next frame
     never comes back (a callback frozen in a background tab, a dropped
     request), the next event notices the silence and starts a fresh chain.
     If two chains ever raced, they would repaint the same numbers and
     retire at the same deadline — idempotent, so harmless. */
  var SETTLE_MS   = 700;    // keep watching this long after the last movement
  var WATCHDOG_MS = 2000;   // declare a silent chain dead after this long

  function tick(now) {
    tickedAt = now;

    var y = window.scrollY;
    if (y !== lastY) { lastY = y; movedAt = now; }

    paint();

    if (now - movedAt > SETTLE_MS) { running = false; return; }
    requestAnimationFrame(tick);
  }

  function schedule() {
    movedAt = performance.now();          // the event itself counts as movement
    if (running && movedAt - tickedAt < WATCHDOG_MS) return;
    running = true;
    requestAnimationFrame(tick);
  }

  /* ---------- preload ---------- */

  function load(i) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.decoding = 'async';

      function settle() {
        loaded++;
        bar.style.width = (loaded / COUNT * 100) + '%';
        resolve();
      }

      img.onload = function () {
        // Decode up front so the first paint of each frame is instant.
        // Keep plain <img> rather than ImageBitmap: the browser may evict
        // a decoded frame under memory pressure and silently re-decode
        // from cache, instead of the tab being killed outright.
        if (img.decode) {
          img.decode().then(function () {
            images[i] = img;
            settle();
          }, function () {
            images[i] = img;
            settle();
          });
        } else {
          images[i] = img;
          settle();
        }
      };

      img.onerror = function () {
        images[i] = null;
        settle();
      };

      img.src = srcFor(i);
    });
  }

  function start() {
    resize();

    // Frame 1 first, so the closed door is on screen almost immediately
    // instead of a black hold while the rest streams in.
    load(0).then(function () {
      paint();

      // Requested in timeline order, so the frames the viewer reaches
      // first are also the ones the browser fetches first.
      var rest = [];
      for (var i = 1; i < COUNT; i++) rest.push(load(i));

      return Promise.all(rest);
    }).then(function () {
      ready = true;
      bar.classList.add('done');
      drawn = -1;
      paint();
    });
  }

  window.addEventListener('scroll', schedule, { passive: true });
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  // A bfcache restore can bring back a scroll position with a stale canvas.
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) { drawn = -1; paint(); }
  });

  start();
})();
</script>

</body>
</html>
