<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Netora</title>
<link rel="preload" as="image" href="frames/frame-001.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Heebo:wght@500&display=swap">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }

  html{ background:#000; }

  body{
    /* The scroll track, in viewport heights:
         100  the viewport itself (never scrolls past)
         750  scrub travel — drives all 119 frames at the vault's original
              rate of ~6.36vh per frame, so the two shots read as one move
         100  hero hold — the last entrance frame sits still down here
       ------
         950                                                              */
    background:#000;
    height:950vh;
    overscroll-behavior-y:none;
  }

  #stage{
    position:fixed;
    inset:0;
    background:#000;
    overflow:hidden;
  }

  #frame{
    display:block;
    width:100%;
    height:100%;
  }

  /* hairline preload indicator — no text, fades out once every frame is in */
  #load{
    position:fixed;
    top:0; left:0;
    height:2px;
    width:0;
    background:#c8a04a;
    pointer-events:none;
    transition:width .18s linear, opacity .5s ease .2s;
    will-change:width;
  }
  #load.done{ opacity:0; }

  /* ---------- hero overlay ---------- */

  /* Rides on top of the rotunda while it holds still at the bottom of the
     track. Anchored to the viewport rather than to the picture: blit()
     covers, so on a wide screen only the middle band of the 9:16 frame is
     ever on show and "upper-left of the image" would drift off it. The
     right half stays empty — that space is spoken for. */
  #hero{
    position:fixed;
    top:0; left:0;
    z-index:2;
    /* Hard ceiling, so the right half stays free for the portfolio
       transition. Relaxed on phones — see the narrow-screen block below. */
    max-width:49vw;
    padding:
      calc(clamp(2.4rem, 9vh, 7rem) + env(safe-area-inset-top))
      0 0
      calc(clamp(0.9rem, 4vw, 3.5rem) + env(safe-area-inset-left));
    opacity:0;
    pointer-events:none;
    text-shadow:0 2px 40px rgba(0,0,0,.8), 0 1px 4px rgba(0,0,0,.6);
    -webkit-font-smoothing:antialiased;
    /* leaving the hold: out of the way before the vault is back on screen */
    transition:opacity .25s ease;
  }
  #hero.on{
    opacity:1;
    transition:opacity .6s ease;
  }

  /* Each line carries an invisible copy of its finished text, which is what
     actually sizes the box; the typed copy is laid over it. Without this the
     block would reflow on the character that tips a line into wrapping. */
  .hero-line{ position:relative; }
  .hero-line .ghost{ visibility:hidden; }
  .hero-line .type{ position:absolute; top:0; left:0; right:0; }

  /* Type sizes are solved, not guessed. Measured in the shipped faces, the
     rendered width of a string is a fixed multiple of its font-size:

       "Welcome to Netora"                 7.68x  (Cormorant Garamond 700)
       "Here we turn dreams into reality"  12.87x (Cormorant Garamond 600)

     Line 1 must never wrap, so its width has to fit the budget the 49vw
     ceiling leaves after the left padding. Solving

         7.68 * size  <=  49vw - 4vw      gives  size <= 5.86vw

     and 5.7vw is that with ~4% held back for rounding and for the wider
     fallback serif on the frames before the webfont resolves. */
  .hero-l1{
    font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-weight:700;
    font-size:clamp(1.05rem, 5.7vw, 8rem);
    line-height:1.02;
    letter-spacing:-.005em;                         /* tighter at display size */
    color:#d9b877;                                  /* warm gold */
  }
  .hero-l1 .accent{
    color:#79bdff;                                  /* the dome's blue */
    text-shadow:0 0 30px rgba(112,180,255,.34), 0 2px 26px rgba(0,0,0,.78);
  }

  .hero-l2{
    margin-top:.5em;                                /* scales with the type */
    font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-weight:600;
    font-size:clamp(.82rem, 3.05vw, 4.25rem);
    line-height:1.24;
    letter-spacing:.004em;
    color:#dde1e6;
  }

  /* fit-content so the RTL line still starts flush with the English ones:
     a full-width rtl block would push its text to the far right. */
  .hero-arrow{
    width:fit-content;
    max-width:100%;
    margin-top:1.6em;
    font-family:'Heebo', 'Arial Hebrew', Arial, sans-serif;
    font-weight:500;
    font-size:clamp(1.05rem, 1.7vw, 2.4rem);
    line-height:1.45;
    letter-spacing:.01em;
    color:rgba(200,160,74,.72);                     /* muted #c8a04a */
    opacity:0;
    transition:opacity .9s ease;
  }
  .hero-arrow.in{ opacity:1; }

  /* Phones get the width back. Half of a 390px screen is 195px, which
     caps a 17-character headline at ~22px — smaller than it is now, and
     too small to lead with; 195px is also too narrow to host the
     portfolio view the reservation exists for. So below the tablet
     breakpoint the block runs to 88vw and the sizes are re-solved against
     that budget: 10.4vw for line 1 against (88vw - 4vw) / 7.68.

     The caps are chosen so the two regimes meet: at 767px this rule gives
     44 / 24 / 16.8px and at 768px the rule above gives 43.8 / 23.4 / 16.8px,
     so nothing jumps across the breakpoint. Landscape phones are wide
     enough to fall under the 49vw rule, which is what we want. */
  @media (max-width:767.98px){
    #hero{ max-width:88vw; }
    .hero-l1{ font-size:clamp(1.5rem, 10.4vw, 2.75rem); }
    .hero-l2{ font-size:clamp(.85rem, 5.6vw, 1.5rem); }
    .hero-arrow{ font-size:clamp(.85rem, 3.4vw, 1.05rem); }
  }

  .hero-sr{
    position:absolute;
    width:1px; height:1px;
    margin:-1px; padding:0;
    overflow:hidden;
    clip:rect(0 0 0 0);
    clip-path:inset(50%);
    white-space:nowrap;
    border:0;
  }

  @media (prefers-reduced-motion:reduce){
    #load{ transition:none; }
    #hero, #hero.on, .hero-arrow{ transition:none; }
  }
</style>
</head>
<body>

<div id="stage"><canvas id="frame"></canvas></div>
<div id="load"></div>

<div id="hero">
  <h1 class="hero-sr">Welcome to Netora</h1>
  <p class="hero-sr">Here we turn dreams into reality</p>
  <p class="hero-sr" lang="he" dir="rtl">↓ לצפייה בעבודות שלנו</p>

  <div aria-hidden="true">
    <div class="hero-line hero-l1">
      <span class="ghost">Welcome to <span class="accent">Netora</span></span>
      <span class="type"><span id="hero-gold"></span><span class="accent" id="hero-accent"></span></span>
    </div>
    <div class="hero-line hero-l2">
      <span class="ghost">Here we turn dreams into reality</span>
      <span class="type" id="hero-l2"></span>
    </div>
    <div class="hero-arrow" id="hero-arrow" lang="he" dir="rtl">↓ לצפייה בעבודות שלנו</div>
  </div>
</div>

<script>
/* The hero overlay types itself out once the rotunda has settled.
   It owns no scroll handling of its own: the scrubber calls enter()/exit()
   off the very same clamped progress value it uses to choose a frame, so
   the reveal cannot drift out of step with the picture underneath it. */
(function () {
  'use strict';

  var GOLD   = 'Welcome to ';
  var ACCENT = 'Netora';
  var LINE2  = 'Here we turn dreams into reality';

  var SETTLE = 300;   // beat between arriving and the first character
  var SPEED1 = 100;   // ms/char on line 1 — slow, this is the dramatic beat
  var SPEED2 = 42;    // ms/char on line 2 — quicker, and following straight
                      // on: there is no pause between the lines, so the two
                      // read as one accelerating run rather than two events
  var BEAT   = 260;   // pause before the arrow starts to fade up

  // Timeline marks, in ms from the moment the hold is reached.
  var T1  = SETTLE + (GOLD.length + ACCENT.length) * SPEED1;   // line 1 done
  var T2  = T1 + LINE2.length * SPEED2;                        // line 2 done
  var END = T2 + BEAT;                                         // arrow fades

  var root   = document.getElementById('hero');
  var gold   = document.getElementById('hero-gold');
  var accent = document.getElementById('hero-accent');
  var line2  = document.getElementById('hero-l2');
  var arrow  = document.getElementById('hero-arrow');
  if (!root || !gold || !accent || !line2 || !arrow) return;

  var reduce = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion:reduce)').matches;

  var now = (window.performance && window.performance.now)
    ? function () { return window.performance.now(); }
    : function () { return Date.now(); };

  var shown   = false;  // block currently faded in
  var running = false;  // clock advancing
  var done    = false;  // fully typed — this never types a second time
  var fonts   = false;  // webfonts settled, so nothing reflows mid-type
  var at      = 0;      // position along the timeline, ms
  var mark    = 0;      // clock reading the current run started from
  var raf     = 0;

  function advance() {
    var t = now();
    var dt = t - mark;
    // A backgrounded tab stops rAF while the clock keeps going; without
    // this cap the reveal would be over before it was ever on screen.
    at += dt > 250 ? 250 : dt;
    mark = t;
  }

  function cut(el, text, n) {
    var next = n <= 0 ? '' : n >= text.length ? text : text.slice(0, n);
    if (el.textContent !== next) el.textContent = next;
  }

  function render() {
    var n1 = Math.floor((at - SETTLE) / SPEED1);
    cut(gold, GOLD, n1);
    cut(accent, ACCENT, n1 - GOLD.length);
    cut(line2, LINE2, Math.floor((at - T1) / SPEED2));
    if (at >= T2 + BEAT) arrow.classList.add('in');
  }

  function stop() {
    running = false;
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
  }

  function finish() {
    stop();
    done = true;
    at = END;
    render();
  }

  function tick() {
    raf = 0;
    if (!running) return;
    advance();
    if (at >= END) { finish(); return; }
    render();
    raf = requestAnimationFrame(tick);
  }

  function resume() {
    if (done || running || !fonts) return;
    if (reduce) { finish(); return; }   // no typing, just the finished state
    running = true;
    mark = now();
    raf = requestAnimationFrame(tick);
  }

  function pause() {
    if (!running) return;
    advance();
    stop();
  }

  function ready() {
    if (fonts) return;
    fonts = true;
    if (shown) resume();
  }

  if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
    var bail = setTimeout(ready, 1500);
    document.fonts.ready.then(function () {
      clearTimeout(bail);
      ready();
    }, ready);
  } else {
    fonts = true;
  }

  /* The scrubber drives these. Both are called on every painted scroll
     event, so both are guarded down to a no-op once settled. */
  window.NetoraHero = {
    // Settled on the last frame: fade in, and start (or pick back up) the
    // type-out. Once done it only ever fades — the beat happens once.
    enter: function () {
      if (!shown) {
        shown = true;
        root.classList.add('on');
      }
      resume();
    },
    // Left the hold. Out of the way fast, and hold the clock where it is
    // so a viewer who bails mid-reveal is not robbed of the rest of it.
    exit: function () {
      if (!shown) return;
      shown = false;
      root.classList.remove('on');
      pause();
    }
  };
})();
</script>

<script>
(function () {
  'use strict';

  // One timeline across two clips: the vault door opens, then the camera
  // carries through the doorway into the rotunda.
  //
  //   timeline 0..47    vault-open    frames/frame-001..048
  //   timeline 48..118  entrance      frames-entrance/frame-002..072
  //
  // The entrance clip's own frame-001 is the same picture as vault
  // frame-048 — it is the seam the two shots were cut on. It stays in the
  // folder so that sequence stands alone, but it is skipped here: spending
  // a scroll step repainting an identical frame would read as a stall at
  // the exact moment the camera should start moving.
  var VAULT = 48;
  var COUNT = 119;

  // Fraction of the scroll track that drives frames. Past it the last
  // frame simply holds, giving the hero rotunda a full viewport of stillness
  // at the bottom. 750 of the 850vh of travel scrubs; the rest holds.
  var SCRUB = 750 / 850;

  var stage  = document.getElementById('stage');
  var canvas = document.getElementById('frame');
  var bar    = document.getElementById('load');
  var ctx    = canvas.getContext('2d', { alpha: false });

  var hero    = window.NetoraHero;

  var images  = new Array(COUNT);
  var loaded  = 0;
  var ready   = false;
  var drawn   = -1;   // frame index currently painted
  var queued  = false;

  function pad(n) {
    return String(n).padStart(3, '0');
  }

  function srcFor(i) {
    return i < VAULT
      ? 'frames/frame-' + pad(i + 1) + '.jpg'
      : 'frames-entrance/frame-' + pad(i - VAULT + 2) + '.jpg';
  }

  /* ---------- painting ---------- */

  // Size the backing store to the viewport, but never ask for more pixels
  // than the source frames actually contain — both clips are 720x1280, so
  // going beyond that just burns memory for no visible detail.
  function resize() {
    var cssW = stage.clientWidth;
    var cssH = stage.clientHeight;
    if (!cssW || !cssH) return;

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.round(cssW * dpr);
    var h = Math.round(cssH * dpr);

    var cap = 1280 * 1280;                       // pixel budget
    var area = w * h;
    if (area > cap) {
      var k = Math.sqrt(cap / area);
      w = Math.round(w * k);
      h = Math.round(h * k);
    }

    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      drawn = -1;                                // force a repaint
    }
    paint();
  }

  // cover: fill the canvas, preserve aspect, centre the overflow
  function blit(img) {
    var cw = canvas.width;
    var ch = canvas.height;
    var iw = img.naturalWidth;
    var ih = img.naturalHeight;
    if (!iw || !ih) return;

    var s = Math.max(cw / iw, ch / ih);
    var w = iw * s;
    var h = ih * s;
    ctx.drawImage(img, (cw - w) / 2, (ch - h) / 2, w, h);
  }

  function progress() {
    var max = document.documentElement.scrollHeight - window.innerHeight;
    if (max <= 0) return 0;
    var p = window.scrollY / max;
    // iOS rubber-banding can overshoot in both directions
    return p < 0 ? 0 : p > 1 ? 1 : p;
  }

  function paint() {
    // Until every frame is decoded, hold on the closed door rather than
    // showing gaps — this is what keeps scrubbing flicker-free later.
    var idx = 0;
    if (ready) {
      var p = progress() / SCRUB;
      if (p > 1) p = 1;                          // the hold at the bottom
      idx = Math.round(p * (COUNT - 1));
    }

    // The hero overlay rides the same clamp: p === 1 is the scrub finished
    // and the rotunda holding still. Above the early-out, which returns on
    // every scroll event once the held frame is already painted.
    if (hero) hero[ready && p >= 1 ? 'enter' : 'exit']();

    if (idx === drawn) return;

    var img = images[idx];
    if (!img || !img.complete || !img.naturalWidth) return;

    drawn = idx;
    blit(img);
  }

  function schedule() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(function () {
      queued = false;
      paint();
    });
  }

  /* ---------- preload ---------- */

  function load(i) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.decoding = 'async';

      function settle() {
        loaded++;
        bar.style.width = (loaded / COUNT * 100) + '%';
        resolve();
      }

      img.onload = function () {
        // Decode up front so the first paint of each frame is instant.
        // Keep plain <img> rather than ImageBitmap: the browser may evict
        // a decoded frame under memory pressure and silently re-decode
        // from cache, instead of the tab being killed outright.
        if (img.decode) {
          img.decode().then(function () {
            images[i] = img;
            settle();
          }, function () {
            images[i] = img;
            settle();
          });
        } else {
          images[i] = img;
          settle();
        }
      };

      img.onerror = function () {
        images[i] = null;
        settle();
      };

      img.src = srcFor(i);
    });
  }

  function start() {
    resize();

    // Frame 1 first, so the closed door is on screen almost immediately
    // instead of a black hold while the rest streams in.
    load(0).then(function () {
      paint();

      // Requested in timeline order, so the frames the viewer reaches
      // first are also the ones the browser fetches first.
      var rest = [];
      for (var i = 1; i < COUNT; i++) rest.push(load(i));

      return Promise.all(rest);
    }).then(function () {
      ready = true;
      bar.classList.add('done');
      drawn = -1;
      paint();
    });
  }

  window.addEventListener('scroll', schedule, { passive: true });
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  // A bfcache restore can bring back a scroll position with a stale canvas.
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) { drawn = -1; paint(); }
  });

  start();
})();
</script>

</body>
</html>
