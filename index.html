<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Netora</title>
<link rel="preload" as="image" href="frames/frame-001.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Heebo:wght@500&display=swap">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }

  html{ background:#000; }

  body{
    /* The scroll track, in viewport heights:
         100  the viewport itself (never scrolls past)
         750  scrub travel — drives all 119 frames at the vault's original
              rate of ~6.36vh per frame, so the two shots read as one move
         100  hero hold — the last entrance frame sits still down here
       ------
         950                                                              */
    background:#000;
    height:950vh;
    overscroll-behavior-y:none;
  }

  #stage{
    position:fixed;
    inset:0;
    background:#000;
    overflow:hidden;
  }

  #frame{
    display:block;
    width:100%;
    height:100%;
  }

  /* hairline preload indicator — no text, fades out once every frame is in */
  #load{
    position:fixed;
    top:0; left:0;
    height:2px;
    width:0;
    background:#c8a04a;
    pointer-events:none;
    transition:width .18s linear, opacity .5s ease .2s;
    will-change:width;
  }
  #load.done{ opacity:0; }

  /* ---------- hero overlay ---------- */

  /* Rides on top of the rotunda while it holds still at the bottom of the
     track. Anchored to the viewport rather than to the picture: blit()
     covers, so on a wide screen only the middle band of the 9:16 frame is
     ever on show and "upper-left of the image" would sit off-screen. */
  #hero{
    position:fixed;
    top:0; left:0;
    z-index:2;
    /* Desktop keeps the whole block off the centre line; phones take more
       width below. Everything is in vw so the proportions hold at any size. */
    max-width:49vw;
    padding:
      calc(30vh + env(safe-area-inset-top))
      0 0
      max(6vw, calc(env(safe-area-inset-left) + 1rem));
    opacity:0;
    pointer-events:none;
    text-shadow:0 2px 40px rgba(0,0,0,.8), 0 1px 4px rgba(0,0,0,.6);
    -webkit-font-smoothing:antialiased;
    /* A guard, never a visible animation: on the way out it holds at full
       opacity until the words have finished leaving, then switches. Fading
       the container instead would hide the very motion it is covering. */
    transition:opacity 0s linear .42s;
  }
  #hero.on{ opacity:1; transition:opacity 0s; }

  /* Every word is a span, always in the document and always occupying its
     space; the reveal only moves opacity, transform and blur, none of which
     affect layout, so nothing reflows mid-reveal. Two states and a per-word
     delay, which is also what makes the reverse free — leaving runs the same
     two states backwards, and nothing is latched, so arriving replays it. */
  .w{
    display:inline-block;
    opacity:0;
    transform:translateY(.42em);
    filter:blur(9px);
    transition:opacity .26s ease, transform .26s ease, filter .26s ease;
  }
  #hero.on .w{
    opacity:1;
    transform:none;
    filter:blur(0);
    transition:opacity .52s ease-out,
               transform .52s cubic-bezier(.22,.68,.24,1),
               filter .52s ease-out;
    transition-delay:calc(var(--i) * 62ms);   /* 10 words, last settles ~1.08s */
  }

  .hero-l1{
    /* The padding above puts the line BOX at 30vh; this lifts it by the
       leading and the gap above the capitals, so the glyph tops land there
       instead. In em, so it re-solves itself for each size regime. */
    margin-top:-.33em;
    font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-weight:500;
    font-size:4.6vw;
    line-height:1.1;
    letter-spacing:.006em;
    color:#d9b877;                                  /* warm gold */
  }
  /* The largest of the three — line 1 introduces it, this is the statement.
     Margins are in em so the gaps grow with the type they separate. */
  .hero-l2{
    margin-top:.7em;
    font-family:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-weight:600;
    font-size:4.9vw;
    line-height:1.15;
    letter-spacing:.004em;
    color:#dde1e6;
  }

  /* fit-content so the RTL line still starts flush with the English ones:
     a full-width rtl block would push its text to the far right. */
  .hero-arrow{
    width:fit-content;
    max-width:100%;
    margin-top:2.6em;
    font-family:'Heebo', 'Arial Hebrew', Arial, sans-serif;
    font-weight:500;
    font-size:2.2vw;
    line-height:1.4;
    letter-spacing:.01em;
    color:rgba(200,160,74,.72);                     /* muted #c8a04a */
  }

  /* Phones run the reference scale itself: 8.8vw gives line 1 the 5.5vw
     cap-height, line 2 is 9vw and breaks of its own accord after "dreams",
     and the block is allowed 88vw. The two regimes cannot meet — a 5.5vw
     capital and a block inside 50vw are not simultaneously satisfiable at
     any width — so the step at 768px is the one the brief asks for, not an
     oversight. */
  @media (max-width:767.98px){
    #hero{ max-width:88vw; }
    .hero-l1{ font-size:8.8vw; }
    .hero-l2{ font-size:9vw; }
    .hero-arrow{ font-size:4vw; }
  }

  /* The real text, for assistive tech and for anything reading the page
     without running the reveal. The animated copy above is aria-hidden. */
  /* TEMPORARY — reveal counter, so the replay can be confirmed on a real
     device. To remove it: delete this rule, the #reveals element in the body,
     and the three lines marked TEMPORARY in the hero script. */
  #reveals{
    position:fixed;
    z-index:4;
    right:calc(.6rem + env(safe-area-inset-right));
    bottom:calc(.6rem + env(safe-area-inset-bottom));
    padding:.32rem .55rem;
    border-radius:.4rem;
    background:rgba(8,14,26,.6);
    border:1px solid rgba(200,160,74,.32);
    color:rgba(226,214,190,.85);
    font:600 .72rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    pointer-events:none;
  }

  .hero-sr{
    position:absolute;
    width:1px; height:1px;
    margin:-1px; padding:0;
    overflow:hidden;
    clip:rect(0 0 0 0);
    clip-path:inset(50%);
    white-space:nowrap;
    border:0;
  }

  @media (prefers-reduced-motion:reduce){
    #load{ transition:none; }
    /* The container guard keeps its delayed switch here too. Making it
       instant hid the words before they could fade out, so the reverse
       looked broken for anyone with this setting on. Only the travel and
       the blur go; the sequence and both directions stay. */
    .w, #hero.on .w{ transform:none; filter:none; }
  }
</style>
</head>
<body>

<div id="stage"><canvas id="frame"></canvas></div>
<div id="load"></div>

<div id="hero">
  <h1 class="hero-sr">Welcome to Netora</h1>
  <p class="hero-sr">Here we turn dreams into reality</p>
  <p class="hero-sr" lang="he" dir="rtl">↓ לצפייה בעבודות שלנו</p>

  <!-- One span per word. --i is its place in the queue; the reveal walks
       them in reading order, line 1, then line 2, then the Hebrew. -->
  <div aria-hidden="true">
    <div class="hero-l1">
      <span class="w" style="--i:0">Welcome</span>
      <span class="w" style="--i:1">to</span>
      <span class="w" style="--i:2">Netora</span>
    </div>
    <div class="hero-l2">
      <span class="w" style="--i:3">Here</span>
      <span class="w" style="--i:4">we</span>
      <span class="w" style="--i:5">turn</span>
      <span class="w" style="--i:6">dreams</span>
      <span class="w" style="--i:7">into</span>
      <span class="w" style="--i:8">reality</span>
    </div>
    <div class="hero-arrow" lang="he" dir="rtl"><span class="w" style="--i:9">↓ לצפייה בעבודות שלנו</span></div>
  </div>
</div>

<!-- TEMPORARY: reveal counter. Remove this element, the #reveals CSS
     rule, and the three TEMPORARY lines in the hero script. -->
<div id="reveals">reveals: 0</div>

<script>
/* The hero overlay reveals itself once the rotunda has settled: each word
   rises into place out of a blur, one a beat behind the last.

   The reveal still only ever starts while the scrubber says the scrub is
   finished — it is the scrubber that calls enter()/exit(), off the very same
   clamped value it uses to choose a frame, and this file never reads the
   scroll to decide that.

   What it does read the scroll for is WHERE inside the hold the viewer is.
   That hold is a whole viewport tall, so "left the hold" only becomes true
   after a full screen of scrolling up; anything shorter kept p at 1, left
   enter() a no-op, and the reveal never replayed. Scrolling up by a tenth of
   a screen now dismisses it and scrolling back down plays it again, so the
   replay follows the gesture rather than the geometry. */
(function () {
  'use strict';

  var root  = document.getElementById('hero');
  var badge = document.getElementById('reveals');          // TEMPORARY
  if (!root) return;

  var shown  = false;   // the reveal class is applied
  var fonts  = false;   // webfonts settled; a swap mid-flight would re-measure
  var inHold = false;   // the scrubber says the scrub is finished
  var entered = false;  // arrived from outside the hold — show on sight
  var peak   = 0;       // deepest scroll seen since the words appeared
  var trough = 0;       // highest scroll seen since they were dismissed
  var fires  = 0;       // TEMPORARY

  // A tenth of a screen: past any rubber-band or thumb jitter, well short of
  // a deliberate scroll.
  function step() {
    return Math.max(60, (window.innerHeight || 800) * 0.1);
  }

  // Clamped, because iOS rubber-banding overshoots at both ends and an
  // overshoot at the bottom would otherwise read as a scroll back up.
  function where() {
    var y = window.pageYOffset;
    if (y === undefined) y = (document.documentElement || document.body).scrollTop;
    var max = document.documentElement.scrollHeight - window.innerHeight;
    return y < 0 ? 0 : (y > max ? max : y);
  }

  function show(y) {
    if (shown) return;
    shown = true;
    peak = y;
    root.classList.add('on');
    fires++;                                                     // TEMPORARY
    if (badge) badge.textContent = 'reveals: ' + fires;          // TEMPORARY
  }

  function hide(y) {
    if (!shown) return;
    shown = false;
    trough = y;
    root.classList.remove('on');
  }

  function settle() {
    var y = where();
    if (!inHold) { hide(y); return; }
    if (!fonts) return;
    if (shown) {
      if (y > peak) peak = y;
      if (peak - y > step()) hide(y);        // scrolled back up: dismiss
    } else if (entered) {
      entered = false;
      show(y);                               // came in from outside the hold
    } else {
      if (y < trough) trough = y;
      if (y - trough > step()) show(y);      // scrolled back down: replay
    }
  }

  function ready() {
    if (fonts) return;
    fonts = true;
    settle();
  }

  if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
    var bail = setTimeout(ready, 1500);
    document.fonts.ready.then(function () { clearTimeout(bail); ready(); }, ready);
  } else {
    fonts = true;
  }

  /* The scrubber drives these on every painted scroll event. */
  window.NetoraHero = {
    enter: function () { inHold = true;  settle(); },
    exit:  function () { inHold = false; entered = true; settle(); }
  };
})();
</script>

<script>
(function () {
  'use strict';

  // One timeline across two clips: the vault door opens, then the camera
  // carries through the doorway into the rotunda.
  //
  //   timeline 0..47    vault-open    frames/frame-001..048
  //   timeline 48..118  entrance      frames-entrance/frame-002..072
  //
  // The entrance clip's own frame-001 is the same picture as vault
  // frame-048 — it is the seam the two shots were cut on. It stays in the
  // folder so that sequence stands alone, but it is skipped here: spending
  // a scroll step repainting an identical frame would read as a stall at
  // the exact moment the camera should start moving.
  var VAULT = 48;
  var COUNT = 119;

  // Fraction of the scroll track that drives frames. Past it the last
  // frame simply holds, giving the hero rotunda a full viewport of stillness
  // at the bottom. 750 of the 850vh of travel scrubs; the rest holds.
  var SCRUB = 750 / 850;

  var stage  = document.getElementById('stage');
  var canvas = document.getElementById('frame');
  var bar    = document.getElementById('load');
  var ctx    = canvas.getContext('2d', { alpha: false });

  var hero    = window.NetoraHero;

  var images  = new Array(COUNT);
  var loaded  = 0;
  var ready   = false;
  var drawn   = -1;   // frame index currently painted
  var queued  = false;

  function pad(n) {
    return String(n).padStart(3, '0');
  }

  function srcFor(i) {
    return i < VAULT
      ? 'frames/frame-' + pad(i + 1) + '.jpg'
      : 'frames-entrance/frame-' + pad(i - VAULT + 2) + '.jpg';
  }

  /* ---------- painting ---------- */

  // Size the backing store to the viewport, but never ask for more pixels
  // than the source frames actually contain — both clips are 720x1280, so
  // going beyond that just burns memory for no visible detail.
  function resize() {
    var cssW = stage.clientWidth;
    var cssH = stage.clientHeight;
    if (!cssW || !cssH) return;

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.round(cssW * dpr);
    var h = Math.round(cssH * dpr);

    var cap = 1280 * 1280;                       // pixel budget
    var area = w * h;
    if (area > cap) {
      var k = Math.sqrt(cap / area);
      w = Math.round(w * k);
      h = Math.round(h * k);
    }

    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      drawn = -1;                                // force a repaint
    }
    paint();
  }

  // cover: fill the canvas, preserve aspect, centre the overflow
  function blit(img) {
    var cw = canvas.width;
    var ch = canvas.height;
    var iw = img.naturalWidth;
    var ih = img.naturalHeight;
    if (!iw || !ih) return;

    var s = Math.max(cw / iw, ch / ih);
    var w = iw * s;
    var h = ih * s;
    ctx.drawImage(img, (cw - w) / 2, (ch - h) / 2, w, h);
  }

  function progress() {
    var max = document.documentElement.scrollHeight - window.innerHeight;
    if (max <= 0) return 0;
    var p = window.scrollY / max;
    // iOS rubber-banding can overshoot in both directions
    return p < 0 ? 0 : p > 1 ? 1 : p;
  }

  function paint() {
    // Until every frame is decoded, hold on the closed door rather than
    // showing gaps — this is what keeps scrubbing flicker-free later.
    var idx = 0;
    if (ready) {
      var p = progress() / SCRUB;
      if (p > 1) p = 1;                          // the hold at the bottom
      idx = Math.round(p * (COUNT - 1));
    }

    // The hero overlay rides the same clamp: p === 1 is the scrub finished
    // and the rotunda holding still. Above the early-out, which returns on
    // every scroll event once the held frame is already painted.
    if (hero) hero[ready && p >= 1 ? 'enter' : 'exit']();

    if (idx === drawn) return;

    var img = images[idx];
    if (!img || !img.complete || !img.naturalWidth) return;

    drawn = idx;
    blit(img);
  }

  function schedule() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(function () {
      queued = false;
      paint();
    });
  }

  /* ---------- preload ---------- */

  function load(i) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.decoding = 'async';

      function settle() {
        loaded++;
        bar.style.width = (loaded / COUNT * 100) + '%';
        resolve();
      }

      img.onload = function () {
        // Decode up front so the first paint of each frame is instant.
        // Keep plain <img> rather than ImageBitmap: the browser may evict
        // a decoded frame under memory pressure and silently re-decode
        // from cache, instead of the tab being killed outright.
        if (img.decode) {
          img.decode().then(function () {
            images[i] = img;
            settle();
          }, function () {
            images[i] = img;
            settle();
          });
        } else {
          images[i] = img;
          settle();
        }
      };

      img.onerror = function () {
        images[i] = null;
        settle();
      };

      img.src = srcFor(i);
    });
  }

  function start() {
    resize();

    // Frame 1 first, so the closed door is on screen almost immediately
    // instead of a black hold while the rest streams in.
    load(0).then(function () {
      paint();

      // Requested in timeline order, so the frames the viewer reaches
      // first are also the ones the browser fetches first.
      var rest = [];
      for (var i = 1; i < COUNT; i++) rest.push(load(i));

      return Promise.all(rest);
    }).then(function () {
      ready = true;
      bar.classList.add('done');
      drawn = -1;
      paint();
    });
  }

  window.addEventListener('scroll', schedule, { passive: true });
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  // A bfcache restore can bring back a scroll position with a stale canvas.
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) { drawn = -1; paint(); }
  });

  start();
})();
</script>

</body>
</html>
