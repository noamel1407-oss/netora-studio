name: Import Higgsfield asset

# Brings a completed Higgsfield render into the repository.
#
# The Claude Code session that drives generation cannot reach Higgsfield's
# delivery CDN — the egress policy answers 403 to CONNECT on those hosts — so a
# generated asset has no route from the job result into the repo. This workflow
# is that route: it runs on GitHub's network, fetches the finished URL, proves
# the bytes are a real image, and commits them to the branch it was dispatched
# from.
#
# It handles no credentials. A Higgsfield result URL is already public and
# self-authenticating, so the workflow only ever receives the finished URL and
# has nothing worth stealing.

on:
  workflow_dispatch:
    inputs:
      asset_url:
        description: "Higgsfield result URL (rawUrl from the completed job)"
        required: true
        type: string
      destination_path:
        description: "Repo path to save to. A bare filename lands in reference/_review/."
        required: true
        type: string
      overwrite:
        description: "Replace the file if the destination already exists"
        required: false
        type: boolean
        default: false
      allow_canonical:
        description: "Permit writing to a canonical locked anchor (reference/frame-*)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Two imports pushing to one branch would race on the same ref.
concurrency:
  group: import-asset-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ASSET_URL: ${{ inputs.asset_url }}
      DESTINATION: ${{ inputs.destination_path }}
      OVERWRITE: ${{ inputs.overwrite }}
      ALLOW_CANONICAL: ${{ inputs.allow_canonical }}
      # A reference frame is ~2.5 MB and a scrubbable clip is single-digit MB.
      # Anything past this is not an asset this pipeline produces.
      MAX_BYTES: "134217728"

    steps:
      - name: Check out the dispatch branch
        uses: actions/checkout@v4

      - name: Resolve and vet the destination
        id: dest
        run: |
          set -euo pipefail

          dest="$DESTINATION"

          # A bare filename is the common case, and review assets are where it
          # should land — never straight onto a locked anchor.
          if [[ "$dest" != */* ]]; then
            dest="reference/_review/$dest"
            echo "Bare filename given; resolved to $dest"
          fi

          # Path traversal, absolute paths and dot-segments: refuse outright.
          case "$dest" in
            /*|*..*|*$'\n'*)
              echo "::error::Refusing '$dest' — the destination must be a relative path with no '..' segments."
              exit 1
              ;;
          esac

          # Assets belong in the asset trees. Nothing here may write source,
          # workflows, or configuration.
          case "$dest" in
            reference/*|public/media/*) : ;;
            *)
              echo "::error::Refusing '$dest' — imports may only write under reference/ or public/media/."
              exit 1
              ;;
          esac

          if [[ ! "$dest" =~ \.(png|jpg|jpeg|webp|gif|mp4|webm)$ ]]; then
            echo "::error::Refusing '$dest' — unsupported extension for an imported asset."
            exit 1
          fi

          # A canonical anchor is a locked reference frame. Overwriting one by
          # accident would silently change what every downstream clip is
          # generated and judged against, so it needs saying out loud.
          if [[ "$dest" =~ ^reference/frame-[^/]+\.(png|jpg|jpeg|webp)$ ]]; then
            if [[ "$ALLOW_CANONICAL" != "true" ]]; then
              echo "::error::'$dest' is a canonical locked anchor. Re-run with allow_canonical=true if that is genuinely intended; otherwise import to reference/_review/ and promote it after review."
              exit 1
            fi
            echo "::warning::Writing directly to canonical anchor $dest (allow_canonical=true)."
          fi

          if [[ -e "$dest" && "$OVERWRITE" != "true" ]]; then
            echo "::error::'$dest' already exists. Re-run with overwrite=true to replace it."
            exit 1
          fi

          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Vet the source host
        run: |
          set -euo pipefail

          # Only Higgsfield delivery hosts. This workflow commits whatever it
          # downloads, so the set of things it will fetch stays closed.
          if [[ ! "$ASSET_URL" =~ ^https://[A-Za-z0-9.-]+/ ]]; then
            echo "::error::asset_url must be an https:// URL."
            exit 1
          fi

          host="$(printf '%s' "$ASSET_URL" | sed -E 's#^https://([^/]+)/.*#\1#')"
          case "$host" in
            *.cloudfront.net|cdn.higgsfield.ai|*.higgsfield.ai) : ;;
            *)
              echo "::error::Refusing host '$host'. Only Higgsfield delivery hosts are permitted."
              exit 1
              ;;
          esac
          echo "Source host: $host"

      - name: Download the asset
        run: |
          set -euo pipefail

          echo "Fetching $ASSET_URL"
          # --fail turns a 4xx/5xx into a non-zero exit instead of a body full
          # of error markup; the size cap stops a mistaken URL from filling
          # the runner.
          status="$(curl --silent --show-error --fail --location \
            --max-time 300 \
            --max-filesize "$MAX_BYTES" \
            --retry 3 --retry-delay 2 --retry-connrefused \
            --write-out '%{http_code}' \
            --output /tmp/asset.bin \
            "$ASSET_URL")" || {
              echo "::error::Download failed. The URL may have expired, been revoked, or never existed."
              exit 1
            }

          if [[ "$status" != "200" ]]; then
            echo "::error::Expected HTTP 200 but the server answered $status."
            exit 1
          fi
          echo "HTTP $status, $(stat -c%s /tmp/asset.bin) bytes"

      - name: Verify it is a real image
        id: verify
        run: |
          set -euo pipefail
          dest="${{ steps.dest.outputs.path }}"

          if [[ "$dest" =~ \.(mp4|webm)$ ]]; then
            summary="video, $(stat -c%s /tmp/asset.bin) bytes"
          else
            # Decides the format from the file's own leading bytes and checks
            # the destination extension against them, so an HTML error page or
            # a half-finished transfer can never be committed as an image.
            summary="$(python3 scripts/verify-image.py /tmp/asset.bin "$dest")"
          fi

          echo "$summary"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          set -euo pipefail

          dest="${{ steps.dest.outputs.path }}"
          mkdir -p "$(dirname "$dest")"
          cp /tmp/asset.bin "$dest"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$dest"

          if git diff --cached --quiet; then
            echo "::notice::$dest is byte-identical to what is already committed; nothing to push."
            exit 0
          fi

          printf '%s\n\n%s\nSource: %s\n' \
            "Import Higgsfield asset to $dest" \
            "${{ steps.verify.outputs.summary }}" \
            "$ASSET_URL" > /tmp/commit-msg.txt
          git commit -q -F /tmp/commit-msg.txt

          # Someone else may have pushed while this ran.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed to ${GITHUB_REF_NAME}"
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto the latest ${GITHUB_REF_NAME}"
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done

          echo "::error::Could not push after three attempts."
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Higgsfield asset import"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Destination | \`${{ steps.dest.outputs.path }}\` |"
            echo "| Detected | ${{ steps.verify.outputs.summary || 'not verified — the run failed earlier' }} |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
